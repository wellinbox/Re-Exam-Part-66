<script>
const RAW_QUESTIONS = [{"q": "What are the three fundamental sub-atomic particles that make up an atom?", "opts": ["Only protons and electrons", "Protons, neutrons and electrons", "Photons, neutrons and ions"], "ans": 1, "exp": "อะตอมประกอบด้วย proton, neutron และ electron", "hook": "Atom = Proton + Neutron + Electron", "module": "3.1 Electron Theory", "mistake": ""}, {"q": "Where is almost all of the mass (substance) of an atom concentrated?", "opts": ["In the electron orbits", "In the nucleus", "In the empty space between orbits"], "ans": 1, "exp": "มวลเกือบทั้งหมดอยู่ที่นิวเคลียส", "hook": "Mass = Nucleus (protons + neutrons)", "module": "3.1 Electron Theory", "mistake": ""}, {"q": "What is the charge of a proton?", "opts": ["Positive", "Negative", "Neutral"], "ans": 0, "exp": "โปรตอนมีประจุบวก", "hook": "Proton = Positive", "module": "3.1 Electron Theory", "mistake": ""}, {"q": "What is the charge of an electron?", "opts": ["Negative", "Positive", "Neutral"], "ans": 0, "exp": "อิเล็กตรอนมีประจุลบ", "hook": "Electron = Negative", "module": "3.1 Electron Theory", "mistake": ""}, {"q": "What is the charge of a neutron?", "opts": ["Positive", "Neutral (no charge)", "Negative"], "ans": 1, "exp": "นิวตรอนไม่มีประจุ", "hook": "Neutron = Neutral", "module": "3.1 Electron Theory", "mistake": ""}, {"q": "What is the simplest atom, having a single proton in its nucleus?", "opts": ["Helium", "Hydrogen", "Oxygen"], "ans": 1, "exp": "ไฮโดรเจนมีโปรตอนเพียง 1 ตัวในนิวเคลียส", "hook": "Simplest atom = Hydrogen", "module": "3.1 Electron Theory", "mistake": ""}, {"q": "What largely determines the size (volume) of an atom?", "opts": ["The number of protons only", "The number of neutrons only", "Its electron orbits"], "ans": 2, "exp": "ขนาดอะตอมถูกกำหนดโดยวงโคจรของอิเล็กตรอน", "hook": "Size = Electron orbits", "module": "3.1 Electron Theory", "mistake": ""}, {"q": "What is the term for the electrons in the outermost shell of an atom?", "opts": ["Core electrons", "Neutron electrons", "Valence electrons"], "ans": 2, "exp": "อิเล็กตรอนในวงนอกสุดเรียกว่า valence electrons", "hook": "Outermost = Valence electrons", "module": "3.1 Electron Theory", "mistake": ""}, {"q": "What is ionisation?", "opts": ["The process of an atom gaining or losing electrons and becoming charged", "The process of combining two atoms into a molecule", "The process of splitting the nucleus"], "ans": 0, "exp": "Ionisation คือการได้อิเล็กตรอนหรือเสียอิเล็กตรอนจนอะตอมมีประจุ", "hook": "Ionisation = Gain or lose electrons", "module": "3.1 Electron Theory", "mistake": ""}, {"q": "What is a positive ion?", "opts": ["An atom that has lost one or more electrons", "An atom that has gained electrons", "A neutral atom"], "ans": 0, "exp": "ไอออนบวกเกิดจากอะตอมที่เสียอิเล็กตรอน", "hook": "Positive ion = Lost electrons", "module": "3.1 Electron Theory", "mistake": ""}, {"q": "What is a negative ion?", "opts": ["An atom that has gained one or more electrons", "An atom that has lost protons", "A free neutron"], "ans": 0, "exp": "ไอออนลบเกิดจากอะตอมที่ได้อิเล็กตรอนเพิ่ม", "hook": "Negative ion = Gained electrons", "module": "3.1 Electron Theory", "mistake": ""}, {"q": "Materials that allow electrons to flow easily are called what?", "opts": ["Insulators", "Semiconductors only", "Conductors"], "ans": 2, "exp": "วัสดุที่ให้อิเล็กตรอนไหลง่ายเรียกว่า conductors", "hook": "Easy electron flow = Conductors", "module": "3.1 Electron Theory", "mistake": ""}, {"q": "Materials that do not allow electrons to flow easily are called what?", "opts": ["Conductors", "Insulators (non-conductors)", "Superconductors"], "ans": 1, "exp": "วัสดุที่ไม่อนุญาตให้อิเล็กตรอนไหลง่ายเรียกว่า insulators", "hook": "Poor electron flow = Insulators", "module": "3.1 Electron Theory", "mistake": ""}, {"q": "What is the atomic number of an element related to?", "opts": ["The number of neutrons only", "The number of protons in the nucleus", "The mass of the electron orbits"], "ans": 1, "exp": "Atomic number = จำนวนโปรตอนในนิวเคลียส", "hook": "Atomic number = Protons", "module": "3.1 Electron Theory", "mistake": ""}, {"q": "Atoms can neither be created nor destroyed during what type of reactions?", "opts": ["Nuclear reactions only", "All possible reactions", "Chemical reactions"], "ans": 2, "exp": "ในปฏิกิริยาเคมี อะตอมไม่ถูกสร้างหรือทำลาย", "hook": "Chemical reactions: atoms conserved", "module": "3.1 Electron Theory", "mistake": ""}, {"q": "What do the electron shells represent?", "opts": ["Energy levels or orbits around the nucleus", "The number of neutrons", "The charge of the nucleus"], "ans": 0, "exp": "Shell คือระดับพลังงานหรือวงโคจรรอบนิวเคลียส", "hook": "Shells = Energy levels / orbits", "module": "3.1 Electron Theory", "mistake": ""}, {"q": "What is a compound?", "opts": ["A substance formed when two or more elements chemically combine", "A pure element only", "A mixture of metals"], "ans": 0, "exp": "สารประกอบเกิดจากการรวมตัวทางเคมีของธาตุตั้งแต่ 2 ชนิดขึ้นไป", "hook": "Compound = Chemical combination of elements", "module": "3.1 Electron Theory", "mistake": ""}, {"q": "What is the main factor that determines whether a material is a conductor or insulator?", "opts": ["Only the atomic mass", "Only the colour of the material", "The number of valence electrons and how tightly they are held"], "ans": 2, "exp": "ขึ้นกับจำนวน valence electrons และความแน่นของการยึด", "hook": "Conductor/insulator = Valence electrons", "module": "3.1 Electron Theory", "mistake": ""}, {"q": "Copper is a good conductor primarily because of what?", "opts": ["It has a full outer shell", "It has no electrons", "It has a single valence electron that is easily freed"], "ans": 2, "exp": "ทองแดงมี valence electron 1 ตัวที่หลุดง่าย", "hook": "Copper = 1 free valence electron", "module": "3.1 Electron Theory", "mistake": ""}, {"q": "What is the nucleus of an atom composed of?", "opts": ["Only electrons", "Protons and neutrons", "Only protons"], "ans": 1, "exp": "นิวเคลียสประกอบด้วยโปรตอนและนิวตรอน", "hook": "Nucleus = Protons + Neutrons", "module": "3.1 Electron Theory", "mistake": ""}, {"q": "Electrons orbit the nucleus in what?", "opts": ["Straight lines only", "Shells (energy levels)", "Random paths with no structure"], "ans": 1, "exp": "อิเล็กตรอนโคจรรอบนิวเคลียสใน shells", "hook": "Electrons orbit in shells", "module": "3.1 Electron Theory", "mistake": ""}, {"q": "What is the mass of an electron compared with a proton?", "opts": ["Equal to a proton", "Much smaller (approximately 1/1836 of a proton)", "Larger than a proton"], "ans": 1, "exp": "มวลอิเล็กตรอนน้อยกว่าโปรตอนมาก (ประมาณ 1/1836)", "hook": "Electron mass << Proton mass", "module": "3.1 Electron Theory", "mistake": ""}, {"q": "What is an element?", "opts": ["A pure substance consisting of only one type of atom", "A mixture of different atoms", "A charged particle only"], "ans": 0, "exp": "ธาตุคือสารบริสุทธิ์ที่ประกอบด้วยอะตอมชนิดเดียว", "hook": "Element = One type of atom", "module": "3.1 Electron Theory", "mistake": ""}, {"q": "Semiconductors have electrical properties that are between those of what?", "opts": ["Only metals", "Conductors and insulators", "Only gases"], "ans": 1, "exp": "เซมิคอนดักเตอร์มีสมบัติระหว่างตัวนำกับฉนวน", "hook": "Semiconductor = Between conductor and insulator", "module": "3.1 Electron Theory", "mistake": ""}, {"q": "What does the term 'valency' refer to in electron theory?", "opts": ["The combining power of an atom related to its valence electrons", "The mass of the nucleus only", "The speed of electrons"], "ans": 0, "exp": "Valency คือความสามารถในการรวมตัวที่เกี่ยวกับ valence electrons", "hook": "Valency = Combining power (valence electrons)", "module": "3.1 Electron Theory", "mistake": ""}, {"q": "What is static electricity?", "opts": ["An accumulation of electric charge on the surface of an object", "A continuous flow of current in a circuit", "The voltage of a battery"], "ans": 0, "exp": "ไฟฟ้าสถิตคือการสะสมประจุบนพื้นผิววัตถุ", "hook": "Static = Accumulated charge on surface", "module": "3.2 Static Electricity", "mistake": ""}, {"q": "Static charges are produced primarily by what process?", "opts": ["Only chemical action", "Friction (contact and separation of materials)", "Only magnetism"], "ans": 1, "exp": "เกิดจากแรงเสียดทานเมื่อวัสดุสัมผัสและแยกออกจากกัน", "hook": "Static from friction", "module": "3.2 Static Electricity", "mistake": ""}, {"q": "Like charges do what to each other?", "opts": ["Attract", "Repel", "Have no effect"], "ans": 1, "exp": "ประจุชนิดเดียวกันผลักกัน", "hook": "Like charges = Repel", "module": "3.2 Static Electricity", "mistake": ""}, {"q": "Unlike charges do what to each other?", "opts": ["Repel", "Cancel completely with no force", "Attract"], "ans": 2, "exp": "ประจุต่างชนิดดึงดูดกัน", "hook": "Unlike charges = Attract", "module": "3.2 Static Electricity", "mistake": ""}, {"q": "What is the unit of electric charge?", "opts": ["Coulomb", "Ampere", "Volt"], "ans": 0, "exp": "หน่วยของประจุคือ Coulomb", "hook": "Charge unit = Coulomb", "module": "3.2 Static Electricity", "mistake": ""}, {"q": "What happens when a charged object is connected to earth (grounded)?", "opts": ["The excess charge flows to or from earth until the object is neutral", "The charge doubles", "Nothing happens"], "ans": 0, "exp": "ประจุส่วนเกินไหลเข้าหรือออกจากดินจนวัตถุเป็นกลาง", "hook": "Grounding = Discharge to earth", "module": "3.2 Static Electricity", "mistake": ""}, {"q": "Aircraft can accumulate static charge in flight due to what?", "opts": ["Only the engines", "Friction with air and precipitation (rain, snow, dust)", "Only the radios"], "ans": 1, "exp": "เครื่องบินสะสมประจุจากแรงเสียดทานกับอากาศและฝน/หิมะ", "hook": "Aircraft static = Air & precipitation friction", "module": "3.2 Static Electricity", "mistake": ""}, {"q": "What devices are used on aircraft to discharge static electricity safely?", "opts": ["Only the landing gear", "Only the battery", "Static dischargers (static wicks)"], "ans": 2, "exp": "ใช้ static dischargers (static wicks) เพื่อคายประจุอย่างปลอดภัย", "hook": "Static wicks = Discharge static", "module": "3.2 Static Electricity", "mistake": ""}, {"q": "Conduction of electricity means what?", "opts": ["The flow of electric charge through a material", "The storage of charge only", "The generation of magnetism only"], "ans": 0, "exp": "การนำไฟฟ้าคือการไหลของประจุผ่านวัสดุ", "hook": "Conduction = Flow of charge", "module": "3.2 Static Electricity", "mistake": ""}, {"q": "What is an electrostatic field?", "opts": ["The region around a charged object where electrostatic forces act", "Only the inside of a battery", "A magnetic field"], "ans": 0, "exp": "สนามไฟฟ้าสถิตคือบริเวณรอบวัตถุที่มีประจุ", "hook": "Electrostatic field = Region around charge", "module": "3.2 Static Electricity", "mistake": ""}, {"q": "When two materials are rubbed together, which one becomes negatively charged?", "opts": ["The one that loses electrons", "Both become positive", "The one that gains electrons"], "ans": 2, "exp": "วัสดุที่ได้อิเล็กตรอนจะมีประจุลบ", "hook": "Gains electrons = Negative", "module": "3.2 Static Electricity", "mistake": ""}, {"q": "What is the purpose of bonding on an aircraft?", "opts": ["To increase static charge", "To ensure all metal parts are at the same potential and prevent sparking", "To insulate all parts"], "ans": 1, "exp": "Bonding ทำให้ชิ้นส่วนโลหะมีศักย์เท่ากัน ป้องกันประกายไฟ", "hook": "Bonding = Same potential, no sparks", "module": "3.2 Static Electricity", "mistake": ""}, {"q": "A conductor allows charge to move freely. An insulator does what?", "opts": ["Holds charge in place and does not allow free movement of charge", "Allows unlimited current", "Creates its own charge continuously"], "ans": 0, "exp": "ฉนวนยึดประจุไว้และไม่อนุญาตให้เคลื่อนที่อิสระ", "hook": "Insulator = Holds charge", "module": "3.2 Static Electricity", "mistake": ""}, {"q": "What can happen if static charge is allowed to build up and discharge suddenly near fuel or flammable vapour?", "opts": ["Nothing significant", "Only a small temperature rise", "A spark that can cause ignition or fire"], "ans": 2, "exp": "ประกายไฟจาก static อาจจุดติดเชื้อเพลิงได้", "hook": "Static spark = Fire risk near fuel", "module": "3.2 Static Electricity", "mistake": ""}, {"q": "The force between two charged objects depends on what factors?", "opts": ["Only the colour of the objects", "The amount of charge and the distance between them", "Only the temperature"], "ans": 1, "exp": "แรงขึ้นกับปริมาณประจุและระยะห่าง", "hook": "Force = Charge amount + Distance", "module": "3.2 Static Electricity", "mistake": ""}, {"q": "What is potential difference (PD)?", "opts": ["The total charge in a circuit", "The difference in electric potential between two points", "The resistance of a wire"], "ans": 1, "exp": "Potential difference คือความต่างศักย์ไฟฟ้าระหว่างสองจุด", "hook": "PD = Difference in potential", "module": "3.3 Electrical Terminology", "mistake": ""}, {"q": "What is electromotive force (EMF)?", "opts": ["The current flowing in a resistor", "The voltage produced by a source (e.g. battery or generator) that can drive current around a circuit", "The power dissipated"], "ans": 1, "exp": "EMF คือแรงเคลื่อนไฟฟ้าที่แหล่งจ่ายสร้างขึ้น", "hook": "EMF = Source voltage that drives current", "module": "3.3 Electrical Terminology", "mistake": ""}, {"q": "What is the unit of voltage (potential difference and EMF)?", "opts": ["Ampere (A)", "Ohm (Ω)", "Volt (V)"], "ans": 2, "exp": "หน่วยของแรงดันคือ Volt", "hook": "Voltage unit = Volt", "module": "3.3 Electrical Terminology", "mistake": ""}, {"q": "What is electric current?", "opts": ["The amount of resistance", "The stored energy in a capacitor", "The rate of flow of electric charge"], "ans": 2, "exp": "กระแสไฟฟ้าคืออัตราการไหลของประจุ", "hook": "Current = Rate of charge flow", "module": "3.3 Electrical Terminology", "mistake": ""}, {"q": "What is the unit of electric current?", "opts": ["Volt (V)", "Watt (W)", "Ampere (A)"], "ans": 2, "exp": "หน่วยของกระแสคื q": "What is the purpose of a battery capacity test?", "opts": ["To determine the actual ampere-hour capability of the battery under defined conditions", "Only to measure open-circuit voltage", "Only to check the colour of the case"], "ans": 0, "exp": "ทดสอบความจุจริงเป็นแอมแปร์-ชั่วโมง", "hook": "Capacity test = measure Ah", "module": "3.5 DC Sources of Electricity", "mistake": ""}, {"q": "What is the effect of high temperature on battery self-discharge?", "opts": ["Self-discharge stops completely", "Self-discharge rate increases", "Self-discharge becomes negative"], "ans": 1, "exp": "อุณหภูมิสูง → self-discharge เร็วขึ้น", "hook": "High temp → faster self-discharge", "module": "3.5 DC Sources of Electricity", "mistake": ""}, {"q": "What is the total current from a 24 V source feeding three parallel 12 Ω resistors?", "opts": ["2 A", "24 A", "6 A"], "ans": 2, "exp": "Each branch 2 A, total 6 A", "hook": "Three 12Ω || on 24V = 6A", "module": "3.6 DC Circuits", "mistake": ""}, {"q": "A series-parallel network reduced to 8 Ω is connected to 32 V. What is the total current?", "opts": ["256 A", "4 A", "0.25 A"], "ans": 1, "exp": "I = 32/8 = 4 A", "hook": "I = V/RT = 4 A", "module": "3.6 DC Circuits", "mistake": ""}, {"q": "What is the charge time constant physical meaning?", "opts": ["The time for the capacitor voltage to change by about 63% of the remaining difference to its final value", "The time to reach exactly 100% in one step", "The time for current to become infinite"], "ans": 0, "exp": "τ = เวลาที่แรงดันเปลี่ยนประมาณ 63% ของค่าที่เหลือ", "hook": "τ ≈ 63% of remaining change", "module": "3.9 Capacitance/Capacitor", "mistake": ""}, {"q": "If three equal capacitors are in series, the total capacitance is what fraction of one capacitor?", "opts": ["Three times", "The same", "One third"], "ans": 2, "exp": "อนุกรม C เท่ากัน 3 ตัว → CT = C/3", "hook": "Three equal C series = C/3", "module": "3.9 Capacitance/Capacitor", "mistake": ""}, {"q": "What is the permeability of let quiz = [], submitted = false, currentFilter = "all";
function shuffle(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}
function buildQuiz() {
  const shuffledQ = shuffle(RAW_QUESTIONS);
  quiz = shuffledQ.map((q, idx) => {
    const correctText = q.opts[q.ans];
    const shuffledOpts = shuffle(q.opts);
    return { id: idx, q: q.q, opts: shuffledOpts, ans: shuffledOpts.indexOf(correctText),
      exp: q.exp||"", hook: q.hook||"", module: q.module||"", userAns: null };
  });
  submitted = false; currentFilter = "all";
  document.getElementById("totalCount").textContent = quiz.length;
  document.getElementById("filterGroup").classList.remove("active");
  document.getElementById("scorePanel").classList.remove("show");
  document.getElementById("footerActions").classList.remove("hidden");
  document.getElementById("btnSubmit").disabled = false;
  renderQuiz(); updateProgress();
}
function updateProgress() {
  const answered = quiz.filter(q => q.userAns !== null).length;
  document.getElementById("progressText").textContent = "ตอบแล้ว " + answered + " / " + quiz.length;
}
function escapeHtml(str) {
  if (!str) return "";
  return String(str).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
}
function renderQuiz() {
  const area = document.getElementById("quizArea");
  area.innerHTML = "";
  quiz.forEach((item, i) => {
    if (submitted) {
      const isCorrect = item.userAns === item.ans;
      if (currentFilter === "correct" && !isCorrect) return;
      if (currentFilter === "wrong" && isCorrect) return;
    }
    const card = document.createElement("div");
    card.className = "question-card";
    if (submitted) card.classList.add(item.userAns === item.ans ? "correct-card" : "wrong-card");
    let html = '<div class="q-text">' + (i+1) + '. ' + escapeHtml(item.q) + '</div><ul class="options">';
    item.opts.forEach((opt, oi) => {
      const letter = String.fromCharCode(97+oi);
      const checked = item.userAns === oi ? " checked" : "";
      const disabled = submitted ? " disabled" : "";
      html += '<li><label><input type="radio" name="q'+i+'" value="'+oi+'"'+checked+disabled+'>';
      html += '<span class="opt-text">'+letter+'. '+escapeHtml(opt)+'</span></label></li>';
    });
    html += '</ul>';
    if (submitted) {
      const cl = String.fromCharCode(97+item.ans);
      html += '<div class="result-box show"><div class="ans-label">คำตอบ : '+cl+'. '+escapeHtml(item.opts[item.ans])+'</div>';
      if (item.exp) html += '<div class="exp"><strong>คำอธิบาย :</strong> '+escapeHtml(item.exp)+'</div>';
      if (item.hook) html += '<div class="hook"><strong>เทคนิคจำ :</strong> '+escapeHtml(item.hook)+'</div>';
      html += '</div>';
    }
    card.innerHTML = html; area.appendChild(card);
  });
  if (!submitted) {
    area.querySelectorAll('input[type="radio"]').forEach(radio => {
      radio.addEventListener("change", function() {
        quiz[parseInt(this.name.replace("q",""),10)].userAns = parseInt(this.value,10);
        updateProgress();
      });
    });
  }
}
function submitQuiz() {
  const unanswered = quiz.filter(q => q.userAns === null).length;
  if (unanswered > 0 && !confirm("ยังมีข้อที่ยังไม่ได้ตอบ "+unanswered+" ข้อ\nต้องการส่งคำตอบเลยหรือไม่?")) return;
  submitted = true;
  let correct = 0;
  quiz.forEach(q => { if (q.userAns === q.ans) correct++; });
  const total = quiz.length, pct = total ? Math.round(correct/total*100) : 0;
  const scoreVal = document.getElementById("scoreValue");
  const scoreBar = document.getElementById("scoreBar");
  scoreVal.textContent = pct + "%";
  document.getElementById("scoreDetail").textContent = "ถูก "+correct+" จาก "+total+" ข้อ";
  scoreBar.style.width = pct + "%";
  scoreBar.classList.remove("green","yellow","red");
  if (pct >= 76) { scoreBar.classList.add("green"); scoreVal.style.color = "#276749"; }
  else if (pct >= 60) { scoreBar.classList.add("yellow"); scoreVal.style.color = "#d69e2e"; }
  else { scoreBar.classList.add("red"); scoreVal.style.color = "#c53030"; }
  document.getElementById("scorePanel").classList.add("show");
  document.getElementById("filterGroup").classList.add("active");
  document.getElementById("btnSubmit").disabled = true;
  document.querySelectorAll(".filter-btn").forEach(b => b.classList.remove("active"));
  document.querySelector('.filter-btn[data-filter="all"]').classList.add("active");
  currentFilter = "all";
  renderQuiz();
  document.getElementById("scorePanel").scrollIntoView({behavior:"smooth",block:"start"});
}
function resetQuiz() { buildQuiz(); window.scrollTo({top:0,behavior:"smooth"}); }
document.getElementById("btnSubmit").addEventListener("click", submitQuiz);
document.getElementById("btnReset").addEventListener("click", resetQuiz);
document.querySelectorAll(".filter-btn").forEach(btn => {
  btn.addEventListener("click", function() {
    document.querySelectorAll(".filter-btn").forEach(b => b.classList.remove("active"));
    this.classList.add("active"); currentFilter = this.dataset.filter; renderQuiz();
  });
});
buildQuiz();
</script>
