<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: "Sarabun","Noto Sans Thai","Segoe UI",Tahoma,sans-serif; background:#fff; color:#111; line-height:1.55; min-height:100vh; }
.header { background:#1a365d; color:#fff; padding:18px 20px; text-align:center; position:sticky; top:0; z-index:100; box-shadow:0 2px 6px rgba(0,0,0,.15); }
.header h1 { font-size:1.25rem; font-weight:700; margin-bottom:4px; }

.toolbar { background:#f7f7f7; border-bottom:1px solid #ddd; padding:12px 16px; display:flex; flex-wrap:wrap; gap:10px; align-items:center; justify-content:center; position:sticky; top:70px; z-index:90; }
.toolbar button, .filter-btn { background:#1a365d; color:#fff; border:none; padding:9px 16px; border-radius:4px; font-size:.9rem; cursor:pointer; font-family:inherit; }
.toolbar button:hover, .filter-btn:hover { background:#2c5282; }
.toolbar button.secondary { background:#555; }
.toolbar button.secondary:hover { background:#333; }
.toolbar .info { font-size:.9rem; color:#333; margin:0 8px; }
.filter-group { display:none; gap:6px; flex-wrap:wrap; align-items:center; }
.filter-group.active { display:flex; }
.filter-btn.active { background:#2c5282; outline:2px solid #1a365d; }
.filter-btn.correct-btn { background:#276749; }
.filter-btn.correct-btn:hover, .filter-btn.correct-btn.active { background:#22543d; }
.filter-btn.wrong-btn { background:#c53030; }
.filter-btn.wrong-btn:hover, .filter-btn.wrong-btn.active { background:#9b2c2c; }
.container { max-width:860px; margin:0 auto; padding:20px 16px 80px; }
.question-card { background:#fff; border:1px solid #e2e8f0; border-radius:6px; padding:16px 18px; margin-bottom:14px; box-shadow:0 1px 3px rgba(0,0,0,.04); }
.question-card.correct-card { border-left:4px solid #276749; background:#f0fff4; }
.question-card.wrong-card { border-left:4px solid #c53030; background:#fff5f5; }
.q-text { font-weight:600; font-size:1rem; margin-bottom:10px; color:#111; }
.options { list-style:none; padding:0; }
.options li { margin-bottom:6px; }
.options label { display:flex; align-items:flex-start; gap:8px; cursor:pointer; padding:7px 10px; border-radius:4px; }
.options label:hover { background:#f7fafc; }
.options input[type="radio"] { margin-top:3px; accent-color:#1a365d; flex-shrink:0; }
.result-box { display:none; margin-top:10px; padding:10px 12px; border-radius:4px; font-size:.9rem; }
.result-box.show { display:block; }
.result-box .ans-label { font-weight:700; color:#c00000; margin-bottom:4px; }
.result-box .exp { color:#333; margin-top:4px; }
.result-box .hook { color:#1a365d; margin-top:3px; font-size:.88rem; }
.score-panel { display:none; background:#fff; border:2px solid #1a365d; border-radius:8px; padding:20px; margin-bottom:20px; text-align:center; }
.score-panel.show { display:block; }
.score-panel h2 { font-size:1.3rem; color:#1a365d; margin-bottom:12px; }
.score-value { font-size:2.4rem; font-weight:700; margin-bottom:8px; }
.score-detail { font-size:.95rem; color:#444; margin-bottom:14px; }
.score-bar-wrap { height:18px; background:#e2e8f0; border-radius:9px; overflow:hidden; margin:0 auto 10px; max-width:400px; }
.score-bar { height:100%; border-radius:9px; transition:width .5s ease; }
.score-bar.green { background:#276749; }
.score-bar.yellow { background:#d69e2e; }
.score-bar.red { background:#c53030; }
.score-legend { font-size:.8rem; color:#666; }
.footer-actions { position:fixed; bottom:0; left:0; right:0; background:#fff; border-top:1px solid #ddd; padding:12px 16px; display:flex; justify-content:center; gap:12px; z-index:80; box-shadow:0 -2px 8px rgba(0,0,0,.08); }
.footer-actions button { background:#1a365d; color:#fff; border:none; padding:12px 28px; border-radius:4px; font-size:1rem; font-weight:600; cursor:pointer; font-family:inherit; }
.footer-actions button:hover { background:#2c5282; }
.footer-actions button.submit-btn { background:#276749; }
.footer-actions button.submit-btn:hover { background:#22543d; }
.footer-actions button:disabled { background:#a0aec0; cursor:not-allowed; }
.progress-text { font-size:.85rem; color:#555; }
</style>
</head>

<script>
const RAW_QUESTIONS = [{"q": "What are the three main states of matter commonly studied?", "opts": ["Only solid and plasma", "Only liquid and vapour", "Solid, liquid and gas"], "ans": 2, "exp": "สถานะหลัก: ของแข็ง ของเหลว แก๊ส", "hook": "States = solid, liquid, gas", "module": "2.1 Matter", "mistake": ""}, {"q": "What is an element?", "opts": ["A mixture of different atoms", "A pure substance consisting of only one type of atom", "A compound of two elements"], "ans": 1, "exp": "ธาตุ = อะตอมชนิดเดียว", "hook": "Element = one type of atom", "module": "2.1 Matter", "mistake": ""}, {"q": "What is a compound?", "opts": ["A substance formed when two or more elements chemically combine in fixed proportions", "A physical mixture only", "A pure element"], "ans": 0, "exp": "สารประกอบ = ธาตุรวมทางเคมีสัดส่วนคงที่", "hook": "Compound = chemical combination", "module": "2.1 Matter", "mistake": ""}, {"q": "What is a mixture?", "opts": ["A pure compound only", "A combination of substances that are not chemically bonded and can be separated by physical means", "Always a new element"], "ans": 1, "exp": "ของผสมแยกได้ด้วยวิธีทางกายภาพ", "hook": "Mixture = not chemically bonded", "module": "2.1 Matter", "mistake": ""}, {"q": "What is the atomic number of an element equal to?", "opts": ["The number of protons in the nucleus", "The number of neutrons only", "The mass number only"], "ans": 0, "exp": "Atomic number = จำนวนโปรตอน", "hook": "Atomic number = protons", "module": "2.1 Matter", "mistake": ""}, {"q": "What is mass number approximately equal to?", "opts": ["Number of electrons only", "Number of valence electrons only", "Number of protons plus neutrons"], "ans": 2, "exp": "Mass number ≈ protons + neutrons", "hook": "A ≈ Z + N", "module": "2.1 Matter", "mistake": ""}, {"q": "What is density?", "opts": ["Volume per unit mass", "Mass per unit volume", "Force per unit area"], "ans": 1, "exp": "ความหนาแน่น = มวลต่อปริมาตร", "hook": "Density = m/V", "module": "2.1 Matter", "mistake": ""}, {"q": "What is specific gravity (relative density)?", "opts": ["Absolute density only", "Ratio of the density of a substance to the density of a reference (usually water for liquids)", "Mass only"], "ans": 1, "exp": "SG = ความหนาแน่นเทียบกับน้ำ", "hook": "SG = density relative to water", "module": "2.1 Matter", "mistake": ""}, {"q": "What is Brownian motion?", "opts": ["Ordered circular motion only", "Motion only in solids", "Random motion of particles suspended in a fluid due to collisions with molecules"], "ans": 2, "exp": "Brownian = การเคลื่อนที่สุ่มจากชนกับโมเลกุล", "hook": "Brownian = random molecular collisions", "module": "2.1 Matter", "mistake": ""}, {"q": "What is adhesion?", "opts": ["Attraction between unlike molecules (e.g. liquid to solid surface)", "Attraction between like molecules only", "Repulsion between all molecules"], "ans": 0, "exp": "Adhesion = แรงดึงดูดระหว่างโมเลกุลต่างชนิด", "hook": "Adhesion = unlike molecules", "module": "2.1 Matter", "mistake": ""}, {"q": "What is cohesion?", "opts": ["Attraction between unlike molecules only", "Attraction between like molecules", "Zero for all liquids"], "ans": 1, "exp": "Cohesion = แรงดึงดูดระหว่างโมเลกุลชนิดเดียวกัน", "hook": "Cohesion = like molecules", "module": "2.1 Matter", "mistake": ""}, {"q": "What happens to most materials when heated (thermal expansion)?", "opts": ["They expand", "They always contract", "Volume never changes"], "ans": 0, "exp": "ส่วนใหญ่ขยายตัวเมื่อร้อน", "hook": "Heat → expansion", "module": "2.1 Matter", "mistake": ""}, {"q": "What is plasma as a state of matter?", "opts": ["Ionised gas with free electrons and ions", "A solid crystal only", "A pure liquid metal"], "ans": 0, "exp": "Plasma = แก๊สที่แตกตัวเป็นไอออน", "hook": "Plasma = ionised gas", "module": "2.1 Matter", "mistake": ""}, {"q": "What is a molecule?", "opts": ["The smallest unit of a compound that retains its chemical properties", "Always a single atom", "Only a mixture"], "ans": 0, "exp": "โมเลกุล = หน่วยเล็กสุดของสารประกอบ", "hook": "Molecule = smallest unit of compound", "module": "2.1 Matter", "mistake": ""}, {"q": "What type of bonding involves sharing of electrons?", "opts": ["Ionic bonding only", "Covalent bonding", "Metallic bonding only"], "ans": 1, "exp": "โควาเลนต์ = ใช้อิเล็กตรอนร่วม", "hook": "Covalent = shared electrons", "module": "2.1 Matter", "mistake": ""}, {"q": "What type of bonding involves transfer of electrons forming ions?", "opts": ["Covalent bonding only", "Ionic bonding", "Van der Waals only"], "ans": 1, "exp": "ไอออนิก = ให้อิเล็กตรอนเกิดไอออน", "hook": "Ionic = electron transfer", "module": "2.1 Matter", "mistake": ""}, {"q": "What is metallic bonding characterised by?", "opts": ["Fixed electron pairs only between two atoms", "No electrons involved", "A sea of delocalised electrons shared among metal atoms"], "ans": 2, "exp": "Metallic = อิเล็กตรอนอิสระในโลหะ", "hook": "Metallic = electron cloud", "module": "2.1 Matter", "mistake": ""}, {"q": "What is the periodic table organised by?", "opts": ["Only alphabetical order", "Atomic number and recurring chemical properties", "Only density"], "ans": 1, "exp": "ตารางธาตุจัดตาม atomic number", "hook": "Periodic table by atomic number", "module": "2.1 Matter", "mistake": ""}, {"q": "What are noble gases known for?", "opts": ["High reactivity always", "Being solids at room temperature always", "Very low chemical reactivity due to full outer electron shells"], "ans": 2, "exp": "แก๊สมีตระกูล = วงนอกเต็ม ทำปฏิกิริยายาก", "hook": "Noble gases = full outer shell", "module": "2.1 Matter", "mistake": ""}, {"q": "What is the difference between mass and weight?", "opts": ["They are identical in all units", "Mass is amount of matter; weight is gravitational force on that mass", "Weight is constant everywhere"], "ans": 1, "exp": "มวล ≠ น้ำหนัก (น้ำหนัก = แรงโน้มถ่วง)", "hook": "Mass ≠ weight", "module": "2.1 Matter", "mistake": ""}, {"q": "What is the SI unit of mass?", "opts": ["Newton", "Litre", "Kilogram (kg)"], "ans": 2, "exp": "หน่วยมวล SI = กิโลกรัม", "hook": "Mass SI = kg", "module": "2.1 Matter", "mistake": ""}, {"q": "What is the SI unit of force/weight?", "opts": ["Kilogram", "Pascal only", "Newton (N)"], "ans": 2, "exp": "หน่วยแรง/น้ำหนัก = นิวตัน", "hook": "Force SI = N", "module": "2.1 Matter", "mistake": ""}, {"q": "When a substance changes from solid to liquid, what is this process called?", "opts": ["Condensation", "Sublimation only", "Melting (fusion)"], "ans": 2, "exp": "ของแข็ง→ของเหลว = หลอมเหลว", "hook": "Solid→liquid = melting", "module": "2.1 Matter", "mistake": ""}, {"q": "When a substance changes from liquid to gas at the boiling point, what is this called?", "opts": ["Freezing", "Deposition", "Boiling / vaporisation"], "ans": 2, "exp": "ของเหลว→แก๊สที่จุดเดือด = เดือด/ระเหย", "hook": "Liquid→gas = boiling", "module": "2.1 Matter", "mistake": ""}, {"q": "What is sublimation?", "opts": ["Change from gas to solid only", "Direct change from solid to gas without becoming liquid", "Change from liquid to solid"], "ans": 1, "exp": "Sublimation = ของแข็ง→แก๊สโดยไมผ่านของเหลว", "hook": "Sublimation = solid→gas direct", "module": "2.1 Matter", "mistake": ""}, {"q": "What is latent heat?", "opts": ["Heat that only raises temperature", "Only electrical energy", "Heat energy absorbed or released during a change of state without temperature change"], "ans": 2, "exp": "Latent heat = ความร้อนเปลี่ยนสถานะโดยอุณหภูมิไม่เปลี่ยน", "hook": "Latent heat = state change, no ΔT", "module": "2.1 Matter", "mistake": ""}, {"q": "What is specific heat capacity?", "opts": ["Heat required to raise the temperature of unit mass by one degree", "Heat to change state only", "Density of the material"], "ans": 0, "exp": "Specific heat = ความร้อนต่อมวลต่อองศา", "hook": "c = heat per mass per degree", "module": "2.1 Matter", "mistake": ""}, {"q": "Why do alloys often have different properties from pure metals?", "opts": ["They are always identical to pure metals", "They cannot form solids", "Different atomic arrangement and bonding modify strength, melting point, corrosion resistance etc."], "ans": 2, "exp": "อัลลอยด์สมบัติต่างจากโลหะบริสุทธิ์", "hook": "Alloys ≠ pure metal properties", "module": "2.1 Matter", "mistake": ""}, {"q": "What is an allotrope?", "opts": ["A mixture of two compounds", "Different structural forms of the same element (e.g. diamond and graphite for carbon)", "A type of ion only"], "ans": 1, "exp": "Allotrope = รูปแบบโครงสร้างต่างของธาตุเดียวกัน", "hook": "Allotrope = different forms same element", "module": "2.1 Matter", "mistake": ""}, {"q": "What conserves during a chemical reaction according to basic theory?", "opts": ["Only volume always", "Mass (atoms are rearranged, not created or destroyed)", "Only temperature"], "ans": 1, "exp": "มวลอนุรักษ์ในปฏิกิริยาเคมี", "hook": "Mass conserved in reaction", "module": "2.1 Matter", "mistake": ""}, {"q": "What is a force?", "opts": ["Only a mass measurement", "A push or pull that can change the motion or shape of a body", "Only energy stored"], "ans": 1, "exp": "แรง = ผลักหรือดึงที่เปลี่ยนการเคลื่อนที่หรือรูปทรง", "hook": "Force = push or pull", "module": "2.2.1 Statics", "mistake": ""}, {"q": "What is the SI unit of force?", "opts": ["Kilogram", "Newton (N)", "Joule"], "ans": 1, "exp": "หน่วยแรง = นิวตัน", "hook": "Force = N", "module": "2.2.1 Statics", "mistake": ""}, {"q": "What is weight?", "opts": ["The same as mass in all situations", "Independent of gravity", "The gravitational force acting on a mass (W = mg)"], "ans": 2, "exp": "น้ำหนัก = mg", "hook": "W = mg", "module": "2.2.1 Statics", "mistake": ""}, {"q": "What is the moment (torque) of a force?", "opts": ["Force × mass only", "Force divided by distance", "Force × perpendicular distance from the point/axis"], "ans": 2, "exp": "โมเมนต์ = F × ระยะตั้งฉาก", "hook": "M = F × d", "module": "2.2.1 Statics", "mistake": ""}, {"q": "What is the condition for equilibrium of a rigid body (coplanar forces)?", "opts": ["Sum of forces = 0 and sum of moments = 0", "Only sum of forces = 0", "Only sum of masses = 0"], "ans": 0, "exp": "สมดุล: ΣF=0 และ ΣM=0", "hook": "Equilibrium: ΣF=0, ΣM=0", "module": "2.2.1 Statics", "mistake": ""}, {"q": "What is the centre of gravity?", "opts": ["The point where the whole weight of the body may be considered to act", "Always the geometric centre only", "A point outside every body"], "ans": 0, "exp": "จุดศูนย์กลางมวล/น้ำหนัก", "hook": "CG = weight acts through", "module": "2.2.1 Statics", "mistake": ""}, {"q": "What is a couple?", "opts": ["Two equal and opposite parallel forces that produce pure rotation (moment = F × separation)", "A single force through the CG", "Three concurrent forces only"], "ans": 0, "exp": "Couple = แรงคู่ขนานเท่ากันทิศตรงข้าม", "hook": "Couple = pure moment", "module": "2.2.1 Statics", "mistake": ""}, {"q": "What is stress?", "opts": ["Force × area", "Mass per volume", "Force per unit area"], "ans": 2, "exp": "ความเค้น = แรงต่อพื้นที่", "hook": "Stress = F/A", "module": "2.2.1 Statics", "mistake": ""}, {"q": "What is strain?", "opts": ["Force per unit area", "Change in dimension / original dimension (dimensionless)", "Energy only"], "ans": 1, "exp": "ความเครียด = ΔL/L", "hook": "Strain = ΔL/L", "module": "2.2.1 Statics", "mistake": ""}, {"q": "What is Hooke’s law?", "opts": ["Stress is independent of strain", "Strain is always zero", "Within elastic limit, stress is proportional to strain"], "ans": 2, "exp": "กฎฮุก: stress ∝ strain ในช่วงยืดหยุ่น", "hook": "Hooke: stress ∝ strain", "module": "2.2.1 Statics", "mistake": ""}, {"q": "What is Young’s modulus (modulus of elasticity)?", "opts": ["Strain / stress only", "Force × distance", "Stress / strain within the elastic range"], "ans": 2, "exp": "E = stress/strain", "hook": "E = stress/strain", "module": "2.2.1 Statics", "mistake": ""}, {"q": "What is the elastic limit?", "opts": ["The maximum stress at which the material returns to original size when load is removed", "The breaking / downwash)", "Only form drag of fuselage"], "ans": 1, "exp": "Induced drag จากสร้าง lift", "hook": "Induced drag from lift", "module": "2.2.4 Fluid Dynamics", "mistake": ""}, {"q": "What is parasite drag?", "opts": ["Drag not associated with lift production (form, skin friction, interference)", "Only induced drag", "Only wave drag"], "ans": 0, "exp": "Parasite drag ไม่เกี่ยวกับ lift", "hook": "Parasite = non-lift drag", "module": "2.2.4 Fluid Dynamics", "mistake": ""}, {"q": "What does a stagnation point represent?", "opts": ["Where local velocity is zero and pressure is total (stagnation) pressure", "Where velocity is maximum", "Where pressure is zero"], "ans": 0, "exp": "Stagnation: v=0, p=pt", "hook": "Stagnation point v=0", "module": "2.2.4 Fluid Dynamics", "mistake": ""}, {"q": "What is the volumetric flow rate Q equal to?", "opts": ["ρ A v", "A × v", "½ ρ v²"], "ans": 1, "exp": "Q = A v", "hook": "Volume flow = Av", "module": "2.2.4 Fluid Dynamics", "mistake": ""}, {"q": "What is mass flow rate equal to?", "opts": ["ρ A v", "A v only without density", "½ ρ v²"], "ans": 0, "exp": "ṁ = ρ A v", "hook": "Mass flow = ρAv", "module": "2.2.4 Fluid Dynamics", "mistake": ""}, {"q": "A car accelerates from 0 to 20 m/s in 5 s. What is the average acceleration?", "opts": ["4 m/s²", "100 m/s²", "0.25 m/s²"], "ans": 0, "exp": "a = Δv/Δt = 20/5 = 4 m/s²", "hook": "a=Δv/t", "module": "2.2.2 Kinetics", "mistake": ""}, {"q": "A mass of 2 kg is accelerated at 3 m/s². What net force is required?", "opts": ["6 N", "5 N", "1.5 N"], "ans": 0, "exp": "F = ma = 2×3 = 6 N", "hook": "F=ma", "module": "2.2.2 Kinetics", "mistake": ""}, {"q": "What is the kinetic energy of a 4 kg mass moving at 3 m/s?", "opts": ["12 J", "36 J", "18 J"], "ans": 2, "exp": "KE = ½×4×9 = 18 J", "hook": "KE=½mv²", "module": "2.2.2 Kinetics", "mistake": ""}, {"q": "What is the momentum of a 5 kg object moving at 4 m/s?", "opts": ["9 kg·m/s", "20 kg·m/s", "1.25 kg·m/s"], "ans": 1, "exp": "p = mv = 20 kg·m/s", "hook": "p=mv", "module": "2.2.2 Kinetics", "mistake": ""}, {"q": "A flywheel has high moment of inertia. What does this mean for angular acceleration under a given torque?", "opts": ["Smaller angular acceleration (harder to speed up or slow down)", "Larger angular acceleration always", "No effect"], "ans": 0, "exp": "I สูง → α ต่ำสำหรับ τ เท่ากัน", "hook": "High I → low α", "module": "2.2.3 Dynamics", "mistake": ""}, {"q": "If the polar moment of inertia is large, a shaft resists what more?", "opts": ["Linear acceleration only", "Angular acceleration / torsion changes", "Temperature change only"], "ans": 1, "exp": "I สูงต้านการเร่งเชิงมุม", "hook": "High I resists α", "module": "2.2.3 Dynamics", "mistake": ""}, {"q": "A wave has frequency 200 Hz and wavelength 1.7 m. What is its speed?", "opts": ["200 m/s", "340 m/s", "1.7 m/s"], "ans": 1, "exp": "v = fλ = 200×1.7 = 340 m/s", "hook": "v=fλ", "module": "2.5 Wave Motion and Sound", "mistake": ""}, {"q": "Two notes of 440 Hz and 444 Hz produce what beat frequency?", "opts": ["4 Hz", "884 Hz", "442 Hz"], "ans": 0, "exp": "Beat = |444−440| = 4 Hz", "hook": "Beat = |f1−f2|", "module": "2.5 Wave Motion and Sound", "mistake": ""}, {"q": "Halving the amplitude of a sound wave does what to intensity (approximately)?", "opts": ["Intensity becomes one quarter (I ∝ A²)", "Intensity halves", "Intensity doubles"], "ans": 0, "exp": "I ∝ A² → A ลดครึ่ง I เหลือ 1/4", "hook": "I ∝ A²", "module": "2.5 Wave Motion and Sound", "mistake": ""}, {"q": "What is the wavelength of a 340 Hz sound in air (v=340 m/s)?", "opts": ["340 m", "0.001 m", "1 m"], "ans": 2, "exp": "λ = v/f = 340/340 = 1 m", "hook": "λ=v/f", "module": "2.5 Wave Motion and Sound", "mistake": ""}, {"q": "What is Avogadro’s number approximately?", "opts": ["6.022 × 10²³ particles per gram", "6.022 × 10²³ particles per mole", "1000 only"], "ans": 1, "exp": "N_A ≈ 6.022×10²³ /mol", "hook": "Avogadro’s number", "module": "2.1 Matter", "mistake": ""}, {"q": "What is a mole in chemistry?", "opts": ["Only a small animal", "Only volume of gas", "Amount of substance containing Avogadro’s number of entities"], "ans": 2, "exp": "โมล = จำนวนอนุภาค N_A", "hook": "Mole = N_A entities", "module": "2.1 Matter", "mistake": ""}, {"q": "What is the difference between an isotope and an element definition?", "opts": ["Isotopes have different proton numbers", "Isotopes: same atomic number (protons), different neutrons / mass number", "Isotopes are compounds"], "ans": 1, "exp": "Isotope = Z เท่า N ต่าง", "hook": "Isotope: same Z, different N", "module": "2.1 Matter", "mistake": ""}, {"q": "What is atomic mass unit (u) based on?", "opts": ["Mass of one hydrogen atom exactly only", "Mass of one electron", "1/12 the mass of a carbon-12 atom"], "ans": 2, "exp": "1 u = 1/12 มวล C-12", "hook": "u based on C-12", "module": "2.1 Matter", "mistake": ""}, {"q": "When ice melts at 0 °C, temperature stays constant while heat is added because of what?", "opts": ["Latent heat of fusion is absorbed for state change", "Specific heat becomes infinite", "No energy is involved"], "ans": 0, "exp": "ใช้ latent heat เปลี่ยนสถานะ อุณหภูมิคงที่", "hook": "Melting uses latent heat", "module": "2.1 Matter", "mistake": ""}, {"q": "What is the section modulus Z of a beam related to?", "opts": ["Z = I × y", "Z = M × I", "Z = I / y_max; used in σ = M / Z"], "ans": 2, "exp": "Z = I/y_max, σ=M/Z", "hook": "Section modulus Z=I/y", "module": "2.2.1 Statics", "mistake": ""}, {"q": "What is buckling of a column?", "opts": ["Only tensile failure", "Sudden lateral instability under compressive load", "Only shear failure"], "ans": 1, "exp": "Buckling = โก่งจากแรงอัด", "hook": "Buckling under compression", "module": "2.2.1 Statics", "mistake": ""}, {"q": "Euler’s critical load for a long slender column depends on what?", "opts": ["Only the yield strength", "EI and effective length (Pcr ∝ EI / L²)", "Only the mass"], "ans": 1, "exp": "Pcr ∝ EI/L²", "hook": "Euler buckling", "module": "2.2.1 Statics", "mistake": ""}, {"q": "What is the difference between yield strength and ultimate strength?", "opts": ["They are identical", "Yield is always higher", "Yield: onset of significant plastic deformation; ultimate: maximum stress before failure"], "ans": 2, "exp": "Yield เริ่มพลาสติก, Ultimate สูงสุด", "hook": "Yield vs ultimate", "module": "2.2.1 Statics", "mistake": ""}, {"q": "What is the absolute temperature scale starting point?", "opts": ["0 °C", "100 °C", "Absolute zero (0 K)"], "ans": 2, "exp": "สเกลสัมบูรณ์เริ่มที่ 0 K", "hook": "Absolute scale from 0 K", "module": "2.3 Thermodynamics", "mistake": ""}, {"q": "What is internal energy U for an ideal gas dependent on?", "opts": ["Pressure only", "Temperature only (for ideal gas)", "Volume only"], "ans": 1, "exp": "Ideal gas U ขึ้นกับ T เท่านั้น", "hook": "Ideal gas U=U(T)", "module": "2.3 Thermodynamics", "mistake": ""}, {"q": "What is a polytropic process?", "opts": ["Only isothermal", "Only adiabatic with γ", "pV^n = constant for some index n"], "ans": 2, "exp": "Polytropic: pV^n=const", "hook": "Polytropic process", "module": "2.3 Thermodynamics", "mistake": ""}, {"q": "What is the focal length of a plane mirror?", "opts": ["Zero", "Equal to radius", "Infinity"], "ans": 2, "exp": "กระจกเงาราบ f = ∞", "hook": "Plane mirror f=∞", "module": "2.4 Optics", "mistake": ""}, {"q": "What is lateral inversion?", "opts": ["Upside-down only", "Left-right reversal of image in a plane mirror", "Magnification only"], "ans": 1, "exp": "Lateral inversion = กลับซ้ายขวา", "hook": "Lateral inversion", "module": "2.4 Optics", "mistake": ""}, {"q": "What is the relationship between radius of curvature R and focal length f for a spherical mirror?", "opts": ["f = R", "f = R/2", "f = 2R"], "ans": 1, "exp": "f = R/2", "hook": "f=R/2", "module": "2.4 Optics", "mistake": ""}, {"q": "What is the barometric formula conceptually related to?", "opts": ["Increase of pressure with altitude always", "Decrease of atmospheric pressure with altitude", "Constant pressure at all heights"], "ans": 1, "exp": "ความดันบรรยากาศลดตามความสูง", "hook": "Pressure falls with height", "module": "2.2.4 Fluid Dynamics", "mistake": ""}, {"q": "What is gauge pressure of 2 bar absolute if atmospheric is 1 bar?", "opts": ["2 bar gauge", "1 bar gauge", "3 bar gauge"], "ans": 1, "exp": "p_gauge = p_abs − p_atm = 1 bar", "hook": "Gauge = abs − atm", "module": "2.2.4 Fluid Dynamics", "mistake": ""}, {"q": "A body falls freely from rest for 2 s (g=10 m/s²). How far does it fall?", "opts": ["10 m", "20 m", "40 m"], "ans": 1, "exp": "s = ½gt² = ½×10×4 = 20 m", "hook": "s=½gt²", "module": "2.2.2 Kinetics", "mistake": ""}, {"q": "What is the weight of a 10 kg mass on Earth (g≈9.81)?", "opts": ["10 N", "About 98.1 N", "9.81 kg"], "ans": 1, "exp": "W = mg ≈ 98.1 N", "hook": "W=mg", "module": "2.2.2 Kinetics", "mistake": ""}, {"q": "If frequency doubles and speed is constant, wavelength does what?", "opts": ["Halves", "Doubles", "Stays the same"], "ans": 0, "exp": "v=fλ → f เพิ่ม 2 เท่า λ ลดครึ่ง", "hook": "↑f → ↓λ", "module": "2.5 Wave Motion and Sound", "mistake": ""}, {"q": "What is the period of a 50 Hz wave?", "opts": ["50 s", "0.02 s", "0.5 s"], "ans": 1, "exp": "T = 1/f = 0.02 s", "hook": "T=1/f", "module": "2.5 Wave Motion and Sound", "mistake": ""}, {"q": "What is the relative atomic mass of carbon-12 by definition?", "opts": ["Exactly 12", "Approximately 12.011 only as definition", "1"], "ans": 0, "exp": "C-12 กำหนด = 12 พอดี", "hook": "C-12 = 12 exactly", "module": "2.1 Matter", "mistake": ""}, {"q": "What is a homogeneous mixture example?", "opts": ["Sand and iron filings clearly separate", "Salt dissolved in water (solution)", "Oil and water undissolved layers only"], "ans": 1, "exp": "สารละลายเป็น homogeneous", "hook": "Solution = homogeneous", "module": "2.1 Matter", "mistake": ""}, {"q": "What is a heterogeneous mixture example?", "opts": ["Sugar completely dissolved in water", "Sand mixed with iron filings", "Pure element"], "ans": 1, "exp": "ทรายกับขี้เลื่อยเหล็ก = heterogeneous", "hook": "Heterogeneous = visibly different parts", "module": "2.1 Matter", "mistake": ""}, {"q": "What happens to the density of most materials when temperature increases?", "opts": ["Density always increases", "Density never changes", "Density usually decreases (expansion)"], "ans": 2, "exp": "ร้อนขึ้นส่วนใหญ่ขยายตัว ความหนาแน่นลด", "hook": "↑T → usually ↓ density", "module": "2.1 Matter", "mistake": ""}];
let quiz=[], submitted=false, currentFilter="all";
function shuffle(a){const b=a.slice();for(let i=b.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[b[i],b[j]]=[b[j],b[i]];}return b;}
function buildQuiz(){
  quiz=shuffle(RAW_QUESTIONS).map((q,idx)=>{const c=q.opts[q.ans],o=shuffle(q.opts);return{id:idx,q:q.q,opts:o,ans:o.indexOf(c),exp:q.exp||"",hook:q.hook||"",userAns:null};});
  submitted=false;currentFilter="all";
  document.getElementById("totalCount").textContent=quiz.length;
  document.getElementById("filterGroup").classList.remove("active");
  document.getElementById("scorePanel").classList.remove("show");
  document.getElementById("btnSubmit").disabled=false;
  renderQuiz();updateProgress();
}
function updateProgress(){document.getElementById("progressText").textContent="ตอบแล้ว "+quiz.filter(q=>q.userAns!==null).length+" / "+quiz.length;}
function escapeHtml(s){if(!s)return"";return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");}
function renderQuiz(){
  const area=document.getElementById("quizArea");area.innerHTML="";
  quiz.forEach((item,i)=>{
    if(submitted){const ok=item.userAns===item.ans;if(currentFilter==="correct"&&!ok)return;if(currentFilter==="wrong"&&ok)return;}
    const card=document.createElement("div");card.className="question-card";
    if(submitted)card.classList.add(item.userAns===item.ans?"correct-card":"wrong-card");
    let h='<div class="q-text">'+(i+1)+'. '+escapeHtml(item.q)+'</div><ul class="options">';
    item.opts.forEach((opt,oi)=>{const L=String.fromCharCode(97+oi),chk=item.userAns===oi?" checked":"",dis=submitted?" disabled":"";
      h+='<li><label><input type="radio" name="q'+i+'" value="'+oi+'"'+chk+dis+'><span class="opt-text">'+L+'. '+escapeHtml(opt)+'</span></label></li>';});
    h+='</ul>';
    if(submitted){const L=String.fromCharCode(97+item.ans);h+='<div class="result-box show"><div class="ans-label">คำตอบ : '+L+'. '+escapeHtml(item.opts[item.ans])+'</div>';
      if(item.exp)h+='<div class="exp"><strong>คำอธิบาย :</strong> '+escapeHtml(item.exp)+'</div>';
      if(item.hook)h+='<div class="hook"><strong>เทคนิคจำ :</strong> '+escapeHtml(item.hook)+'</div>';h+='</div>';}
    card.innerHTML=h;area.appendChild(card);
  });
  if(!submitted)area.querySelectorAll('input[type="radio"]').forEach(r=>{r.addEventListener("change",function(){quiz[parseInt(this.name.replace("q",""),10)].userAns=parseInt(this.value,10);updateProgress();});});
}
function submitQuiz(){
  const u=quiz.filter(q=>q.userAns===null).length;
  if(u>0&&!confirm("ยังมีข้อที่ยังไม่ได้ตอบ "+u+" ข้อ\nต้องการส่งคำตอบเลยหรือไม่?"))return;
  submitted=true;let c=0;quiz.forEach(q=>{if(q.userAns===q.ans)c++;});
  const t=quiz.length,pct=t?Math.round(c/t*100):0;
  const sv=document.getElementById("scoreValue"),sb=document.getElementById("scoreBar");
  sv.textContent=pct+"%";document.getElementById("scoreDetail").textContent="ถูก "+c+" จาก "+t+" ข้อ";
  sb.style.width=pct+"%";sb.classList.remove("green","yellow","red");
  if(pct>=76){sb.classList.add("green");sv.style.color="#276749";}
  else if(pct>=60){sb.classList.add("yellow");sv.style.color="#d69e2e";}
  else{sb.classList.add("red");sv.style.color="#c53030";}
  document.getElementById("scorePanel").classList.add("show");
  document.getElementById("filterGroup").classList.add("active");
  document.getElementById("btnSubmit").disabled=true;
  document.querySelectorAll(".filter-btn").forEach(b=>b.classList.remove("active"));
  document.querySelector('.filter-btn[data-filter="all"]').classList.add("active");
  currentFilter="all";renderQuiz();
  document.getElementById("scorePanel").scrollIntoView({behavior:"smooth",block:"start"});
}
document.getElementById("btnSubmit").addEventListener("click",submitQuiz);
document.getElementById("btnReset").addEventListener("click",()=>{buildQuiz();window.scrollTo({top:0,behavior:"smooth"});});
document.querySelectorAll(".filter-btn").forEach(btn=>{btn.addEventListener("click",function(){document.querySelectorAll(".filter-btn").forEach(b=>b.classList.remove("active"));this.classList.add("active");currentFilter=this.dataset.filter;renderQuiz();});});
buildQuiz();
</script>
