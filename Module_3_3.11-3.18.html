<script>
const RAW_QUESTIONS = [{"q": "What does Faraday’s law of induction state?", "opts": ["A steady magnetic field always induces maximum EMF", "Only electric fields can induce voltage", "A changing magnetic flux through a circuit induces an EMF in that circuit"], "ans": 2, "exp": "ฟลักซ์แม่เหล็กที่เปลี่ยนผ่านวงจรเหนี่ยวนำให้เกิด EMF", "hook": "Faraday: changing flux → EMF", "module": "3.11 Inductance/Inductor", "mistake": ""}, {"q": "What is an inductor?", "opts": ["A component that stores energy in a magnetic field and opposes changes in current", "A component that stores energy only in an electric field", "A device that only produces DC voltage chemically"], "ans": 0, "exp": "อินดักเตอร์เก็บพลังงานในสนามแม่เหล็กและต้านการเปลี่ยนแปลงกระแส", "hook": "Inductor = magnetic energy, opposes ΔI", "module": "3.11 Inductance/Inductor", "mistake": ""}, {"q": "What is the unit of inductance?", "opts": ["Farad (F)", "Henry (H)", "Ohm (Ω)"], "ans": 1, "exp": "หน่วย inductance คือ Henry", "hook": "Inductance unit = Henry", "module": "3.11 Inductance/Inductor", "mistake": ""}, {"q": "What is back EMF in an inductor?", "opts": ["The voltage induced that opposes the change in current producing it", "The supply voltage only", "A voltage that always aids the supply"], "ans": 0, "exp": "Back EMF คือแรงดันเหนี่ยวนำที่ต้านการเปลี่ยนแปลงกระแส", "hook": "Back EMF opposes current change", "module": "3.11 Inductance/Inductor", "mistake": ""}, {"q": "What is the time constant of an RL circuit?", "opts": ["τ = L × R", "τ = L / R", "τ = R / L"], "ans": 1, "exp": "ค่าคงที่เวลา RL คือ L/R", "hook": "τ = L/R", "module": "3.11 Inductance/Inductor", "mistake": ""}, {"q": "After approximately how many time constants does inductor current reach about 99% of final value?", "opts": ["About 5 time constants", "1 time constant", "2 time constants"], "ans": 0, "exp": "ประมาณ 5τ ได้ประมาณ 99%", "hook": "≈5τ → ~99%", "module": "3.11 Inductance/Inductor", "mistake": ""}, {"q": "What is the energy stored in an inductor?", "opts": ["E = ½ C V²", "E = L × I", "E = ½ L I²"], "ans": 2, "exp": "พลังงานในอินดักเตอร์ = ½LI²", "hook": "Energy = ½LI²", "module": "3.11 Inductance/Inductor", "mistake": ""}, {"q": "What does Lenz’s law state?", "opts": ["Induced EMF always aids the flux change", "The direction of induced EMF opposes the change in flux that causes it", "Direction of EMF is random"], "ans": 1, "exp": "ทิศทาง EMF เหนี่ยวนำต้านการเปลี่ยนแปลงฟลักซ์", "hook": "Lenz: induced EMF opposes change", "module": "3.11 Inductance/Inductor", "mistake": ""}, {"q": "What is self-inductance?", "opts": ["Inductance of a circuit due to its own changing current inducing voltage in itself", "Inductance only between two separate circuits", "Zero for all coils"], "ans": 0, "exp": "Self-inductance = วงจรเหนี่ยวนำตัวเอง", "hook": "Self-L = own current change", "module": "3.11 Inductance/Inductor", "mistake": ""}, {"q": "What is mutual inductance?", "opts": ["Inductance of a single isolated turn only", "Inductance where changing current in one circuit induces voltage in a neighbouring circuit", "Only the resistance between coils"], "ans": 1, "exp": "Mutual inductance = เหนี่ยวนำระหว่างวงจร", "hook": "Mutual-L = between circuits", "module": "3.11 Inductance/Inductor", "mistake": ""}, {"q": "How does inductance of a coil change if the number of turns is doubled (other factors constant)?", "opts": ["Inductance doubles", "Inductance halves", "Inductance becomes about four times greater (L ∝ N²)"], "ans": 2, "exp": "L แปรผันกับ N²", "hook": "L ∝ N²", "module": "3.11 Inductance/Inductor", "mistake": ""}, {"q": "What factors increase the inductance of a coil?", "opts": ["More turns, higher permeability core, larger cross-section, shorter magnetic path", "Fewer turns and air core only", "Higher resistance wire only"], "ans": 0, "exp": "เพิ่มรอบ แกน permeability สูง พื้นที่ใหญ่ ทางสั้น", "hook": "↑N, ↑μ, ↑A, ↓l → ↑L", "module": "3.11 Inductance/Inductor", "mistake": ""}, {"q": "What is the coupling coefficient k?", "opts": ["A measure of how well two coils are magnetically coupled (0 to 1)", "The resistance of the coil", "The capacitance between turns"], "ans": 0, "exp": "k = ค่าการคัปปลิ้งแม่เหล็กระหว่างขดลวด (0–1)", "hook": "k = coupling 0 to 1", "module": "3.11 Inductance/Inductor", "mistake": ""}, {"q": "When inductors are in series with no mutual coupling, total inductance is what?", "opts": ["Sum of individual inductances", "Product of inductances", "Less than the smallest"], "ans": 0, "exp": "อนุกรมไม่มี mutual → LT = L1+L2+…", "hook": "Series L (no mutual) = sum", "module": "3.11 Inductance/Inductor", "mistake": ""}, {"q": "When inductors are in parallel with no mutual coupling, reciprocal of total L is what?", "opts": ["Sum of individual L", "Sum of reciprocals of individual L", "Product of L"], "ans": 1, "exp": "ขนาน: 1/LT = 1/L1 + 1/L2 + …", "hook": "Parallel L: 1/LT = sum 1/L", "module": "3.11 Inductance/Inductor", "mistake": ""}, {"q": "In an RL series circuit on DC, initial current when switch closes is approximately what?", "opts": ["Maximum equal to V/R immediately", "Zero (inductor acts as open at the instant of switching)", "Infinite"], "ans": 1, "exp": "ตอนสวิตช์ปิด อินดักเตอร์ทำตัวเหมือนเปิด กระแสเริ่มต้น ≈ 0", "hook": "t=0+: inductor open, I≈0", "module": "3.11 Inductance/Inductor", "mistake": ""}, {"q": "In an RL series circuit on DC after a long time, the inductor behaves like what?", "opts": ["An open circuit", "A short circuit (steady current V/R limited only by R)", "A capacitor"], "ans": 1, "exp": "เวลาผ่านไปนาน อินดักเตอร์เหมือนชอร์ต กระแส = V/R", "hook": "t→∞: inductor short, I=V/R", "module": "3.11 Inductance/Inductor", "mistake": ""}, {"q": "What is inductive reactance XL?", "opts": ["The same as resistance in DC only", "Opposition of an inductor to AC; XL = 2πfL", "Independent of frequency"], "ans": 1, "exp": "XL = 2πfL", "hook": "XL = 2πfL", "module": "3.11 Inductance/Inductor", "mistake": ""}, {"q": "How does inductive reactance change with frequency?", "opts": ["XL decreases as frequency increases", "XL increases as frequency increases", "XL is independent of frequency"], "ans": 1, "exp": "ความถี่เพิ่ม → XL เพิ่ม", "hook": "↑f → ↑XL", "module": "3.11 Inductance/Inductor", "mistake": ""}, {"q": "In a pure inductive AC circuit, current lags voltage by how many degrees?", "opts": ["0 degrees", "90 degrees", "180 degrees"], "ans": 1, "exp": "ในวงจร L บริสุทธิ์ กระแสตามหลังแรงดัน 90 องศา", "hook": "Pure L: I lags V by 90°", "module": "3.11 Inductance/Inductor", "mistake": ""}, {"q": "What is the saturation point of an inductor core?", "opts": ["The point of zero inductance", "The point where further increase in current produces little increase in flux", "The maximum safe voltage only"], "ans": 1, "exp": "Saturation = เพิ่มกระแสแล้วฟลักซ์เพิ่มได้น้อย", "hook": "Saturation = flux flattens", "module": "3.11 Inductance/Inductor", "mistake": ""}, {"q": "What is the main use of inductors in circuits?", "opts": ["Filtering, energy storage, chokes, tuned circuits, transformers", "Only as fuses", "Only as pure resistors"], "ans": 0, "exp": "ใช้กรอง เก็บพลังงาน choke วงจรจูน", "hook": "Inductor uses = filter, choke, tuned", "module": "3.11 Inductance/Inductor", "mistake": ""}, {"q": "What is a choke in electrical terms?", "opts": ["A type of capacitor", "A pure resistor", "An inductor used to impede AC while allowing DC to pass more easily"], "ans": 2, "exp": "Choke = อินดักเตอร์ที่ต้าน AC ผ่าน DC ได้ง่ายกว่า", "hook": "Choke = block AC, pass DC", "module": "3.11 Inductance/Inductor", "mistake": ""}, {"q": "Power in a pure inductor averaged over a cycle is what?", "opts": ["Zero (energy is stored and returned)", "Equal to I²R only", "Maximum continuous heating"], "ans": 0, "exp": "กำลังเฉลี่ยใน L บริสุทธิ์เป็นศูนย์", "hook": "Pure L average power = 0", "module": "3.11 Inductance/Inductor", "mistake": ""}, {"q": "What polarity rule helps determine induced EMF direction in a coil?", "opts": ["Only Ohm’s law", "Only colour codes", "Lenz’s law / right-hand rules relating flux change and current direction"], "ans": 2, "exp": "ใช้กฎของเลนซ์และกฎมือขวา", "hook": "Direction from Lenz / hand rules", "module": "3.11 Inductance/Inductor", "mistake": ""}, {"q": "Mutually coupled series inductors aiding have total L equal to what?", "opts": ["L1 + L2 − 2M", "L1 + L2 + 2M", "L1 + L2 only"], "ans": 1, "exp": "อนุกรมช่วยกัน LT = L1+L2+2M", "hook": "Series aiding = L1+L2+2M", "module": "3.11 Inductance/Inductor", "mistake": ""}, {"q": "Mutually coupled series inductors opposing have total L equal to what?", "opts": ["L1 + L2 + 2M", "L1 + L2 − 2M", "L1 × L2"], "ans": 1, "exp": "อนุกรมต้านกัน LT = L1+L2−2M", "hook": "Series opposing = L1+L2−2M", "module": "3.11 Inductance/Inductor", "mistake": ""}, {"q": "What is the relationship between mutual inductance M and coupling coefficient k?", "opts": ["M = k √(L1 L2)", "M = k (L1 + L2)", "M = k / (L1 L2)"], "ans": 0, "exp": "M = k√(L1 L2)", "hook": "M = k√(L1L2)", "module": "3.11 Inductance/Inductor", "mistake": ""}, {"q": "Why does an inductor oppose a sudden increase in current?", "opts": ["Inductors have infinite resistance always", "Inductors store only electric charge", "Changing current causes changing flux which induces back EMF opposing the increase"], "ans": 2, "exp": "กระแสเปลี่ยน → ฟลักซ์เปลี่ยน → back EMF ต้าน", "hook": "ΔI → back EMF opposes", "module": "3.11 Inductance/Inductor", "mistake": ""}, {"q": "What core material generally gives higher inductance than an air core for the same coil?", "opts": ["Plastic core only", "Wood core only", "Ferromagnetic core (e.g. iron, ferrite)"], "ans": 2, "exp": "แกนเฟอร์โรแมกเนติกให้ L สูงกว่าแกนอากาศ", "hook": "Ferromagnetic core → higher L", "module": "3.11 Inductance/Inductor", "mistake": ""}, {"q": "What is the formula for inductance of a simple long coil (solenoid) proportional to?", "opts": ["N² A μ / l", "N A / μ", "Only wire resistance"], "ans": 0, "exp": "L ∝ N² A μ / l", "hook": "L ∝ N²Aμ/l", "module": "3.11 Inductance/Inductor", "mistake": ""}, {"q": "When the current through an inductor is interrupted suddenly, what can occur?", "opts": ["Nothing; current stops with zero voltage", "A large voltage spike (back EMF) that may arc across the switch", "Only a decrease in resistance"], "ans": 1, "exp": "ตัดกระแสทันทีเกิด voltage spike สูง", "hook": "Sudden interrupt → high voltage spike", "module": "3.11 Inductance/Inductor", "mistake": ""}, {"q": "What is the phase angle between voltage and current in a pure inductor?", "opts": ["They are in phase", "Current leads by 90°", "Current lags voltage by 90°"], "ans": 2, "exp": "I ตามหลัง V 90°", "hook": "I lags V 90°", "module": "3.11 Inductance/Inductor", "mistake": ""}, {"q": "LR series circuit transient behaviour is analogous to what RC behaviour?", "opts": ["Both are linear with time only", "Neither has a time constant", "Both follow exponential growth/decay with time constant"], "ans": 2, "exp": "ทั้ง LR และ RC เป็น exponential ตาม τ", "hook": "LR and RC = exponential τ", "module": "3.11 Inductance/Inductor", "mistake": ""}, {"q": "What does a laminated core help reduce in an inductor or transformer?", "opts": ["The inductance to zero", "All magnetic flux", "Eddy current losses"], "ans": 2, "exp": "แกนแผ่นบางลด eddy current loss", "hook": "Lamination → ↓ eddy loss", "module": "3.11 Inductance/Inductor", "mistake": ""}, {"q": "What is the basic principle of a DC generator?", "opts": ["A conductor moving in a magnetic field has an EMF induced in it", "Chemical action only", "Photoelectric effect only"], "ans": 0, "exp": "ตัวนำเคลื่อนในสนามแม่เหล็กเกิด EMF", "hook": "Generator: motion in B → EMF", "module": "3.12 DC Motor/Generator Theory", "mistake": ""}, {"q": "What is the basic principle of a DC motor?", "opts": ["Only induction without current", "A current-carrying conductor in a magnetic field experiences a force", "Only chemical force"], "ans": 1, "exp": "ตัวนำมีกระแสในสนามแม่เหล็กมีแรงกระทำ",  induce rotor current", "Slip only exists in DC motors"], "ans": 1, "exp": "ต้องมีความเร็วสัมพัทธ์จึงเหนี่ยวนำกระแสโรเตอร์", "hook": "Slip needed to induce rotor current", "module": "3.18 AC Motors", "mistake": ""}, {"q": "What is synchronous speed of an induction motor?", "opts": ["Ns = 120 f / P", "Ns = 120 P / f", "Ns = f × P"], "ans": 0, "exp": "Ns = 120f/P", "hook": "Ns = 120f/P", "module": "3.18 AC Motors", "mistake": ""}, {"q": "A 4-pole motor on 50 Hz has synchronous speed of what?", "opts": ["1 500 rpm", "3 000 rpm", "750 rpm"], "ans": 0, "exp": "Ns = 120×50/4 = 1500 rpm", "hook": "4-pole 50Hz → 1500 rpm", "module": "3.18 AC Motors", "mistake": ""}, {"q": "What is a squirrel-cage rotor?", "opts": ["Rotor with conductive bars shorted by end rings, no external connections", "Rotor with wound coils and slip rings only", "Only a permanent magnet rotor"], "ans": 0, "exp": "Squirrel-cage = แท่งตัวนำสั้นด้วย end ring", "hook": "Squirrel-cage = bars + end rings", "module": "3.18 AC Motors", "mistake": ""}, {"q": "What is a wound-rotor (slip-ring) induction motor characterised by?", "opts": ["Rotor windings brought out via slip rings for external resistance control", "No rotor conductors", "Only permanent magnets on rotor"], "ans": 0, "exp": "Wound rotor มีสลิปริงต่อความต้านทานภายนอก", "hook": "Wound rotor = slip rings + external R", "module": "3.18 AC Motors", "mistake": ""}, {"q": "What is the effect of adding resistance in the rotor circuit of a wound-rotor motor?", "opts": ["Always lower starting torque", "Higher starting torque and lower starting current; speed control under load", "No effect on torque"], "ans": 1, "exp": "เพิ่ม R โรเตอร์ → แรงบิดสตาร์ทสูง กระแสสตาร์ทต่ำ", "hook": "Rotor R ↑ → start T ↑, start I ↓", "module": "3.18 AC Motors", "mistake": ""}, {"q": "What is a synchronous motor?", "opts": ["Motor that must always have large slip", "Motor that only runs on DC", "Motor that runs at exactly synchronous speed when locked in step with the rotating field"], "ans": 2, "exp": "Synchronous motor วิ่งที่ความเร็วซิงโครนัส", "hook": "Synchronous = runs at Ns", "module": "3.18 AC Motors", "mistake": ""}, {"q": "How is a synchronous motor typically started?", "opts": ["By applying full AC to a shorted field only", "As an induction motor (damper windings) then pulled into step by applying field excitation", "Only by mechanical spinning with no electricity"], "ans": 1, "exp": "สตาร์ทแบบเหนี่ยวนำแล้วใส่ field ดึงเข้าซิงค์", "hook": "Start as induction, then excite", "module": "3.18 AC Motors", "mistake": ""}, {"q": "What is the power factor of a synchronous motor related to excitation?", "opts": ["Always unity regardless of excitation", "Always zero", "Under-excited: lagging; over-excited: leading (can correct PF)"], "ans": 2, "exp": "Under-excited lagging, over-excited leading", "hook": "Sync motor PF vs excitation", "module": "3.18 AC Motors", "mistake": ""}, {"q": "What is a single-phase induction motor’s main problem at start?", "opts": ["No starting torque from a single rotating field alone (needs auxiliary method)", "Too much starting torque always", "It only runs on three-phase"], "ans": 0, "exp": "เฟสเดียวไม่มีแรงบิดสตาร์ทจากสนามเดียว", "hook": "1-ph: no inherent start torque", "module": "3.18 AC Motors", "mistake": ""}, {"q": "What methods are used to start single-phase induction motors?", "opts": ["Only removing the rotor", "Auxiliary winding with capacitor or resistance, shaded pole, repulsion methods etc.", "Only using pure DC"], "ans": 1, "exp": "ใช้ขดช่วย + คาปาซิเตอร์/R, shaded pole ฯลฯ", "hook": "1-ph start: aux winding, shaded pole…", "module": "3.18 AC Motors", "mistake": ""}, {"q": "What is a capacitor-start motor?", "opts": ["Three-phase motor only", "DC series motor", "Single-phase motor with capacitor in series with auxiliary winding for starting"], "ans": 2, "exp": "Capacitor-start = C อนุกรมขดช่วยตอนสตาร์ท", "hook": "Cap-start = C + aux winding", "module": "3.18 AC Motors", "mistake": ""}, {"q": "What is a shaded-pole motor typically used for?", "opts": ["Small low-torque applications (fans, small appliances)", "High-power traction only", "Only synchronous high-power drives"], "ans": 0, "exp": "Shaded-pole ใช้งานแรงบิดต่ำขนาดเล็ก", "hook": "Shaded-pole = small, low torque", "module": "3.18 AC Motors", "mistake": ""}, {"q": "What is the direction of rotation of an induction motor determined by?", "opts": ["Only the number of rotor bars", "Only the frame size", "The phase sequence of the supply to the stator"], "ans": 2, "exp": "ทิศทางหมุนขึ้นกับ phase sequence", "hook": "Rotation direction = phase sequence", "module": "3.18 AC Motors", "mistake": ""}, {"q": "How can the direction of a three-phase induction motor be reversed?", "opts": ["Change only the frequency", "Swap any two supply phases", "Open one phase permanently"], "ans": 1, "exp": "สลับสองเฟสเพื่อกลับทิศ", "hook": "Reverse = swap two phases", "module": "3.18 AC Motors", "mistake": ""}, {"q": "What is breakdown (maximum) torque of an induction motor?", "opts": ["The maximum torque the motor can develop; beyond this it stalls", "The torque at synchronous speed only", "Zero torque always"], "ans": 0, "exp": "Breakdown torque = แรงบิดสูงสุดก่อนหยุด", "hook": "Breakdown T = max torque", "module": "3.18 AC Motors", "mistake": ""}, {"q": "What is the typical full-load slip of a small induction motor?", "opts": ["50%", "A few percent (e.g. 2–5%)", "100%"], "ans": 1, "exp": "Slip เต็มโหลดประมาณไม่กี่เปอร์เซ็นต์", "hook": "Full-load slip ≈ few %", "module": "3.18 AC Motors", "mistake": ""}, {"q": "What is a universal motor?", "opts": ["Only three-phase induction", "Only permanent-magnet synchronous", "Motor that can run on AC or DC (series-wound with laminated structure)"], "ans": 2, "exp": "Universal = ใช้ได้ทั้ง AC และ DC", "hook": "Universal = AC/DC series type", "module": "3.18 AC Motors", "mistake": ""}, {"q": "What is the main advantage of AC induction motors over DC motors in many applications?", "opts": ["Always higher starting torque in every design", "Simpler, more robust, less maintenance (no commutator/brushes in squirrel-cage)", "They require commutators"], "ans": 1, "exp": "เหนี่ยวนำง่าย ทนทาน บำรุงน้อย", "hook": "Induction: simple, robust, low maintenance", "module": "3.18 AC Motors", "mistake": ""}, {"q": "What is V/f control used for in induction motor drives?", "opts": ["Only to increase slip to 100%", "Only for DC machines", "To control speed while keeping flux approximately constant"], "ans": 2, "exp": "V/f ควบคุมความเร็วโดยรักษาฟลักซ์", "hook": "V/f = speed control, constant flux", "module": "3.18 AC Motors", "mistake": ""}, {"q": "What happens if one phase of a three-phase induction motor is lost while running?", "opts": ["It always stops instantly with no damage risk", "It may continue running with reduced power and possible overheating (single-phasing)", "Speed doubles"], "ans": 1, "exp": "หายหนึ่งเฟสอาจวิ่งต่อได้แต่ร้อนและกำลังลด", "hook": "Single-phasing risk", "module": "3.18 AC Motors", "mistake": ""}, {"q": "What is the rotor frequency in an induction motor equal to?", "opts": ["Supply frequency always", "Zero always", "Slip × supply frequency"], "ans": 2, "exp": "ความถี่โรเตอร์ = s × f", "hook": "fr = s f", "module": "3.18 AC Motors", "mistake": ""}];
let quiz=[], submitted=false, currentFilter="all";
function shuffle(a){const b=a.slice();for(let i=b.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[b[i],b[j]]=[b[j],b[i]];}return b;}
function buildQuiz(){
  quiz=shuffle(RAW_QUESTIONS).map((q,idx)=>{
    const c=q.opts[q.ans], o=shuffle(q.opts);
    return {id:idx,q:q.q,opts:o,ans:o.indexOf(c),exp:q.exp||"",hook:q.hook||"",userAns:null};
  });
  submitted=false; currentFilter="all";
  document.getElementById("totalCount").textContent=quiz.length;
  document.getElementById("filterGroup").classList.remove("active");
  document.getElementById("scorePanel").classList.remove("show");
  document.getElementById("btnSubmit").disabled=false;
  renderQuiz(); updateProgress();
}
function updateProgress(){
  document.getElementById("progressText").textContent="ตอบแล้ว "+quiz.filter(q=>q.userAns!==null).length+" / "+quiz.length;
}
function escapeHtml(s){if(!s)return"";return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");}
function renderQuiz(){
  const area=document.getElementById("quizArea"); area.innerHTML="";
  quiz.forEach((item,i)=>{
    if(submitted){const ok=item.userAns===item.ans; if(currentFilter==="correct"&&!ok)return; if(currentFilter==="wrong"&&ok)return;}
    const card=document.createElement("div"); card.className="question-card";
    if(submitted) card.classList.add(item.userAns===item.ans?"correct-card":"wrong-card");
    let h='<div class="q-text">'+(i+1)+'. '+escapeHtml(item.q)+'</div><ul class="options">';
    item.opts.forEach((opt,oi)=>{
      const L=String.fromCharCode(97+oi), chk=item.userAns===oi?" checked":"", dis=submitted?" disabled":"";
      h+='<li><label><input type="radio" name="q'+i+'" value="'+oi+'"'+chk+dis+'><span class="opt-text">'+L+'. '+escapeHtml(opt)+'</span></label></li>';
    });
    h+='</ul>';
    if(submitted){
      const L=String.fromCharCode(97+item.ans);
      h+='<div class="result-box show"><div class="ans-label">คำตอบ : '+L+'. '+escapeHtml(item.opts[item.ans])+'</div>';
      if(item.exp) h+='<div class="exp"><strong>คำอธิบาย :</strong> '+escapeHtml(item.exp)+'</div>';
      if(item.hook) h+='<div class="hook"><strong>เทคนิคจำ :</strong> '+escapeHtml(item.hook)+'</div>';
      h+='</div>';
    }
    card.innerHTML=h; area.appendChild(card);
  });
  if(!submitted) area.querySelectorAll('input[type="radio"]').forEach(r=>{
    r.addEventListener("change",function(){quiz[parseInt(this.name.replace("q",""),10)].userAns=parseInt(this.value,10);updateProgress();});
  });
}
function submitQuiz(){
  const u=quiz.filter(q=>q.userAns===null).length;
  if(u>0&&!confirm("ยังมีข้อที่ยังไม่ได้ตอบ "+u+" ข้อ\nต้องการส่งคำตอบเลยหรือไม่?"))return;
  submitted=true; let c=0; quiz.forEach(q=>{if(q.userAns===q.ans)c++;});
  const t=quiz.length, pct=t?Math.round(c/t*100):0;
  const sv=document.getElementById("scoreValue"), sb=document.getElementById("scoreBar");
  sv.textContent=pct+"%"; document.getElementById("scoreDetail").textContent="ถูก "+c+" จาก "+t+" ข้อ";
  sb.style.width=pct+"%"; sb.classList.remove("green","yellow","red");
  if(pct>=76){sb.classList.add("green");sv.style.color="#276749";}
  else if(pct>=60){sb.classList.add("yellow");sv.style.color="#d69e2e";}
  else{sb.classList.add("red");sv.style.color="#c53030";}
  document.getElementById("scorePanel").classList.add("show");
  document.getElementById("filterGroup").classList.add("active");
  document.getElementById("btnSubmit").disabled=true;
  document.querySelectorAll(".filter-btn").forEach(b=>b.classList.remove("active"));
  document.querySelector('.filter-btn[data-filter="all"]').classList.add("active");
  currentFilter="all"; renderQuiz();
  document.getElementById("scorePanel").scrollIntoView({behavior:"smooth",block:"start"});
}
document.getElementById("btnSubmit").addEventListener("click",submitQuiz);
document.getElementById("btnReset").addEventListener("click",()=>{buildQuiz();window.scrollTo({top:0,behavior:"smooth"});});
document.querySelectorAll(".filter-btn").forEach(btn=>{
  btn.addEventListener("click",function(){document.querySelectorAll(".filter-btn").forEach(b=>b.classList.remove("active"));this.classList.add("active");currentFilter=this.dataset.filter;renderQuiz();});
});
buildQuiz();
</script>
