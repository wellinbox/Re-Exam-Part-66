ute to manoeuvre load alleviation?", "opts": ["Ailerons (and sometimes other surfaces) are deflected to reduce structural loads during manoeuvres", "Only the landing gear is used", "Only the engines are throttled"], "ans": 0, "exp": "Aileron ถูกเบี่ยงเพื่อลดภาระโครงสร้างระหว่างการทำ manoeuvre", "hook": "Load alleviation = Aileron deflection", "module": "Module 5.15 Part 2"}, {"q": "What is the basic principle of FBW control surface actuation?", "opts": ["Pilot inputs are interpreted by computers which then command electrically signalled, hydraulically powered actuators", "Direct mechanical cables move the surfaces", "Only pneumatic pressure is used"], "ans": 0, "exp": "Input ของนักบินถูกคอมพิวเตอร์ตีความแล้วสั่ง actuator ที่ใช้ไฟฟ้าส่งสัญญาณและไฮดรอลิกขับเคลื่อน", "hook": "Pilot → Computers → Electric signal → Hydraulic actuators", "module": "Module 5.15 Part 2"}, {"q": "In FBW, what is the role of the flight control computers?", "opts": ["They interpret pilot and auto-pilot orders, apply flight envelope protections and command the surface actuators", "They only display information", "They only control the cabin temperature"], "ans": 0, "exp": "คอมพิวเตอร์ตีความคำสั่ง ใช้การป้องกัน envelope และสั่ง actuator", "hook": "FCC = Interpret + Protect + Command", "module": "Module 5.15 Part 2"}, {"q": "What happens to the FBW system if one of the flight control computers fails?", "opts": ["Remaining computers continue to provide control with possible reconfiguration or degraded modes", "All control is immediately lost", "The aircraft can only fly straight and level forever"], "ans": 0, "exp": "คอมพิวเตอร์ที่เหลือยังควบคุมได้ อาจมีการ reconfigure หรือโหมดลดประสิทธิภาพ", "hook": "Computer fail → Remaining computers take over", "module": "Module 5.15 Part 2"}, {"q": "Why is FBW said to offer flight test savings?", "opts": ["Software changes can correct handling problems that would otherwise require expensive hardware modifications", "No flight testing is ever required", "Only ground testing is needed"], "ans": 0, "exp": "แก้ปัญหาการควบคุมด้วยการเปลี่ยน software แทนการดัดแปลงฮาร์ดแวร์ที่มีราคาแพง", "hook": "Software fix = Flight test savings", "module": "Module 5.15 Part 2"}, {"q": "What is an example of a protection that FBW can provide during take-off and landing?", "opts": ["Avoiding tail-strike by limiting nose-up attitude", "Only engine fire protection", "Only cabin pressurisation"], "ans": 0, "exp": "จำกัดมุมเงยเพื่อป้องกัน tail-strike", "hook": "Tail-strike protection = Limit nose-up attitude", "module": "Module 5.15 Part 2"}, {"q": "In normal law, the FBW system provides protections in which axes?", "opts": ["Pitch and roll axes (the rudder has no equivalent protection)", "All three axes equally", "Only the yaw axis"], "ans": 0, "exp": "ใน normal law มีการป้องกัน pitch และ roll แต่ rudder ไม่มี", "hook": "Normal law protections = Pitch + Roll (not rudder)", "module": "Module 5.15 Part 2"}, {"q": "What is the advantage of FBW for engine-out handling?", "opts": ["The system can automatically assist in maintaining control and reducing pilot workload", "The aircraft becomes uncontrollable", "Only the remaining engines are shut down"], "ans": 0, "exp": "ระบบช่วยรักษาการควบคุมและลดภาระงานของนักบินอัตโนมัติ", "hook": "Engine-out = Automatic assistance", "module": "Module 5.15 Part 2"}, {"q": "How are speed brakes controlled in a typical Airbus FBW system?", "opts": ["Electrically signalled", "Only by direct mechanical linkage", "Only by the flight engineer"], "ans": 0, "exp": "Speed brakes ถูกสั่งด้วยสัญญาณไฟฟ้า", "hook": "Speed brakes = Electrical signalling", "module": "Module 5.15 Part 2"}, {"q": "What is required for the FBW system to remain operational after certain failures?", "opts": ["Adequate electrical power and hydraulic pressure from remaining systems", "Only the original computers", "No power is needed"], "ans": 0, "exp": "ต้องมีไฟฟ้าและไฮดรอลิกจากระบบที่เหลือเพียงพอ", "hook": "FBW survival = Remaining power + hydraulics", "module": "Module 5.15 Part 2"}, {"q": "What are the three segments of the GPS system?", "opts": ["Space segment, control segment and user segment", "Only space and user", "Only ground and air"], "ans": 0, "exp": "GPS มี 3 ส่วน: space, control และ user", "hook": "GPS = Space + Control + User", "module": "Module 5.15 Part 2"}, {"q": "What is the function of the GPS control segment?", "opts": ["Ground stations that monitor satellites and upload corrections to the almanac and ephemeris", "The satellites themselves", "The receivers in the aircraft"], "ans": 0, "exp": "สถานีภาคพื้นติดตามดาวเทียมและอัปโหลดข้อมูลแก้ไข", "hook": "Control segment = Monitor + Upload corrections", "module": "Module 5.15 Part 2"}, {"q": "What is the user segment of GPS?", "opts": ["The GPS receivers and associated equipment on the aircraft (or other users)", "Only the ground stations", "Only the satellites"], "ans": 0, "exp": "User segment คือเครื่องรับ GPS และอุปกรณ์ที่เกี่ยวข้องบนเครื่องบิน", "hook": "User segment = Aircraft receivers", "module": "Module 5.15 Part 2"}, {"q": "What causes the ranges measured by a GPS receiver to be called ‘pseudo-ranges’?", "opts": ["Because of receiver clock error and other delays that must still be corrected", "Because the satellites are not accurate", "Because GPS cannot measure range"], "ans": 0, "exp": "เรียกว่า pseudo เพราะยังมี error จากนาฬิกาเครื่องรับและดีเลย์อื่น ๆ", "hook": "Pseudo-range = Range with clock error", "module": "Module 5.15 Part 2"}, {"q": "What is the purpose of GPS augmentation systems?", "opts": ["To improve accuracy, integrity and availability of the basic GPS service (e.g. SBAS, GBAS)", "To replace all satellites", "To provide only entertainment"], "ans": 0, "exp": "ระบบเสริม (SBAS/GBAS) ช่วยเพิ่มความแม่นยำ integrity และ availability", "hook": "Augmentation = Better accuracy + integrity", "module": "Module 5.15 Part 2"}, {"q": "What is the main function of an IRS after it has been aligned?", "opts": ["To provide continuous attitude, heading, position and velocity without external radio aids", "To measure only air temperature", "To control the cabin lights"], "ans": 0, "exp": "หลัง align แล้ว IRS ให้ attitude heading position และ velocity อย่างต่อเนื่องโดยไม่พึ่ง radio", "hook": "Aligned IRS = Self-contained navigation", "module": "Module 5.15 Part 2"}, {"q": "What sensors measure angular rates in a modern IRS?", "opts": ["Laser gyros (ring laser gyros) or fibre-optic gyros", "Only mechanical spinning gyros", "Only accelerometers"], "ans": 0, "exp": "ใช้ laser gyro หรือ fibre-optic gyro วัดอัตราการหมุน", "hook": "Modern IRS gyros = Laser / FOG", "module": "Module 5.15 Part 2"}, {"q": "What is the purpose of the Mode Select Unit (MSU) for the IRS?", "opts": ["To allow the crew to select IRS modes such as OFF, ALIGN, NAV and ATT", "To tune the VOR receivers", "To control the autopilot only"], "ans": 0, "exp": "MSU ใช้เลือกโหมดของ IRS", "hook": "MSU = Select IRS mode", "module": "Module 5.15 Part 2"}, {"q": "What does the IRS provide in ATT (attitude) mode if full navigation is not available?", "opts": ["Attitude and heading information even if position data is degraded or lost", "Only position", "Only airspeed"], "ans": 0, "exp": "โหมด ATT ยังให้ attitude และ heading ได้แม้ position จะเสีย", "hook": "ATT mode = Attitude + Heading retained", "module": "Module 5.15 Part 2"}, {"q": "What is BITE used for in IRS and other digital systems?", "opts": ["Built-In Test Equipment that continuously or on-demand checks system health and isolates faults", "Only for loading new software", "Only for passenger entertainment"], "ans": 0, "exp": "BITE ตรวจสอบสุขภาพระบบและแยก fault ได้", "hook": "BITE = Built-In Test + Fault isolation", "module": "Module 5.15 Part 2"}, {"q": "What is the difference between a Traffic Advisory (TA) and a Resolution Advisory (RA) in TCAS?", "opts": ["TA warns of nearby traffic; RA provides specific vertical guidance to avoid collision", "TA is more urgent than RA", "There is no difference"], "ans": 0, "exp": "TA แจ้งเตือน traffic ใกล้เคียง ส่วน RA ให้คำแนะนำการหลบในแนวตั้ง", "hook": "TA = Alert, RA = Climb/Descend guidance", "module": "Module 5.15 Part 2"}, {"q": "What is required for two aircraft to generate coordinated Resolution Advisories?", "opts": ["Both must be equipped with ACAS II (TCAS II) and Mode S transponders", "Only one needs TCAS", "Both must be under the same ATC frequency"], "ans": 0, "exp": "ทั้งสองเครื่องต้องมี ACAS II และ Mode S", "hook": "Coordinated RA = Both ACAS II + Mode S", "module": "Module 5.15 Part 2"}, {"q": "In modern aircraft, where is TCAS information often displayed?", "opts": ["Integrated on the Navigation Display (ND) or a combined VSI/TCAS indicator", "Only on a separate paper chart", "Only on the engine instruments"], "ans": 0, "exp": "มักรวมอยู่ใน ND หรือจอ VSI/TCAS รวม", "hook": "TCAS display = ND or combined VSI", "module": "Module 5.15 Part 2"}, {"q": "What is the primary purpose of the Information Systems on modern aircraft?", "opts": ["To provide flight crew, cabin crew and maintenance personnel with operational, maintenance and cabin information", "Only to play movies", "Only to control the engines"], "ans": 0, "exp": "ให้ข้อมูลด้านการปฏิบัติการ ซ่อมบำรุง และห้องโดยสารแก่ลูกเรือและช่าง", "hook": "Info Systems = Ops + Maint + Cabin data", "module": "Module 5.15 Part 2"}, {"q": "What is an Electronic Flight Bag (EFB)?", "opts": ["An electronic device that replaces paper charts, manuals and other flight documents", "A physical bag for carrying manuals", "Only a fuel calculator"], "ans": 0, "exp": "EFB เป็นอุปกรณ์อิเล็กทรอนิกส์ที่แทนที่เอกสารกระดาษ", "hook": "EFB = Electronic replacement for paper", "module": "Module 5.15 Part 2"}, {"q": "What is the purpose of a Health Management System on the aircraft?", "opts": ["To monitor systems health, predict maintenance needs and support condition-based maintenance", "Only to measure passenger health", "Only to control the air conditioning"], "ans": 0, "exp": "มอนิเตอร์สุขภาพระบบ คาดการณ์การบำรุงรักษา และสนับสนุน condition-based maintenance", "hook": "Health Mgmt = Monitor + Predict maintenance", "module": "Module 5.15 Part 2"}, {"q": "What is an example of an on-board information system on Airbus aircraft?", "opts": ["The On-board Information System (OIS) or Network Server System (NSS)", "Only the TCAS computer", "Only the IRS"], "ans": 0, "exp": "Airbus มี OIS หรือ NSS เป็นระบบข้อมูลบนเครื่อง", "hook": "Airbus = OIS / NSS", "module": "Module 5.15 Part 2"}, {"q": "What is the function of the Network Server System (NSS)?", "opts": ["To host applications and provide data services for flight operations, maintenance and cabin domains", "Only to control the engines", "Only to provide passenger Wi-Fi without any other function"], "ans": 0, "exp": "NSS โฮสต์ application และให้บริการข้อมูลสำหรับ flight ops, maintenance และ cabin", "hook": "NSS = Host apps for Ops + Maint + Cabin", "module": "Module 5.15 Part 2"}, {"q": "What is an electronic logbook (e-logbook)?", "opts": ["A digital system that replaces the traditional paper technical log for recording defects and maintenance actions", "Only a passenger manifest", "Only a fuel log"], "ans": 0, "exp": "e-logbook เป็นระบบดิจิทัลแทน technical log กระดาษ", "hook": "e-logbook = Digital tech log", "module": "Module 5.15 Part 2"}, {"q": "In the context of information systems, what is the Flight Deck Information System used for?", "opts": ["To provide the flight crew with operational data, manuals, charts and performance information", "Only to show cabin camera images", "Only to control the IFE"], "ans": 0, "exp": "ให้ข้อมูลปฏิบัติการ คู่มือ แผนที่ และ performance แก่นักบิน", "hook": "Flight Deck Info = Ops data + manuals + charts", "module": "Module 5.15 Part 2"}, {"q": "What is the Maintenance Information System primarily used for?", "opts": ["To give maintenance personnel access to system status, fault data, documentation and troubleshooting information", "Only to book passenger seats", "Only to play music"], "ans": 0, "exp": "ให้ช่างเข้าถึงสถานะระบบ ข้อมูล fault เอกสาร และ troubleshooting", "hook": "Maint Info = Status + Faults + Docs", "module": "Module 5.15 Part 2"}, {"q": "What is a key advantage of digital information systems over paper-based systems?", "opts": ["Faster access, easier updates, reduced weight and the ability to link data across systems", "They are always heavier", "They cannot be updated"], "ans": 0, "exp": "เข้าถึงเร็ว อัปเดตง่าย น้ำหนักเบา และเชื่อมโยงข้อมูลข้ามระบบได้", "hook": "Digital = Fast + Updatable + Lightweight + Linked", "module": "Module 5.15 Part 2"}, {"q": "How can maintenance personnel often interface with the aircraft information systems?", "opts": ["Via laptop or dedicated terminals connected to the network server system", "Only by reading paper manuals", "Only through the cabin interphone"], "ans": 0, "exp": "เชื่อมต่อด้วย laptop หรือ terminal เข้ากับ network server", "hook": "Maint access = Laptop / terminal to NSS", "module": "Module 5.15 Part 2"}, {"q": "What domains are typically supported by modern aircraft information systems?", "opts": ["Flight operations domain, communication/cabin domain and maintenance domain", "Only the passenger entertainment domain", "Only the engine domain"], "ans": 0, "exp": "รองรับโดเมน flight operations, cabin/communication และ maintenance", "hook": "Domains = Ops + Cabin + Maint", "module": "Module 5.15 Part 2"}, {"q": "What is the main goal of integrating information systems on the aircraft?", "opts": ["To improve operational efficiency, safety and maintenance effectiveness by providing timely, accurate data to the right users", "To increase the number of paper documents", "To remove all displays from the cockpit"], "ans": 0, "exp": "เพื่อเพิ่มประสิทธิภาพ ความปลอดภัย และประสิทธิผลการบำรุงรักษาด้วยข้อมูลที่ถูกต้องและทันเวลา", "hook": "Integrated info = Efficiency + Safety + Better maintenance", "module": "Module 5.15 Part 2"}, {"q": "In GPS, what is the ephemeris?", "opts": ["The precise orbital data of each individual satellite transmitted for accurate position calculation", "The coarse almanac of all satellites", "The receiver clock correction only"], "ans": 0, "exp": "Ephemeris คือข้อมูลวงโคจรที่แม่นยำของดาวเทียมแต่ละดวง", "hook": "Ephemeris = Precise orbit of one satellite", "module": "Module 5.15 Part 2"}, {"q": "Why is a fourth satellite needed for a basic GPS position fix?", "opts": ["To solve for the receiver clock error in addition to the three position coordinates", "To provide backup power", "To measure only altitude"], "ans": 0, "exp": "ดาวเทียมดวงที่ 4 ใช้แก้ error ของนาฬิกาเครื่องรับ", "hook": "4th satellite = Clock correction", "module": "Module 5.15 Part 2"}, {"q": "What is the relationship of TCAS to ADS-B according to the study notes?", "opts": ["ADS-B can enhance traffic awareness but TCAS remains the system that provides Resolution Advisories", "ADS-B has completely replaced TCAS", "TCAS is only used on the ground"], "ans": 0, "exp": "ADS-B ช่วยเพิ่มการรับรู้ traffic แต่ TCAS ยังเป็นระบบที่ให้ RA", "hook": "ADS-B enhances awareness, TCAS gives RA", "module": "Module 5.15 Part 2"}, {"q": "What is a key feature of modern digital aircraft systems regarding BITE?", "opts": ["Most systems incorporate Built-In Test Equipment for continuous monitoring and fault isolation", "BITE is only used on mechanical systems", "No digital system has BITE"], "ans": 0, "exp": "ระบบดิจิทัลส่วนใหญ่มี BITE สำหรับมอนิเตอร์และแยก fault", "hook": "Digital systems = BITE standard", "module": "Module 5.15 Part 2"}, {"q": "What is the overall trend described in the preface of Module 5.15 regarding avionics?", "opts": ["Avionics is becoming the third most expensive item after airframe and engines, with increasing use of digital systems and satellite-based CNS", "Avionics is becoming less important", "Only analogue systems are used"], "ans": 0, "exp": "Avionics เป็นรายการแพงอันดับสาม และมีแนวโน้มใช้ระบบดิจิทัลกับ satellite-based CNS มากขึ้น", "hook": "Avionics = 3rd cost + Digital + Satellite CNS", "module": "Module 5.15 Part 2"}, {"q": "What is the main advantage of AFDX over classic ARINC 429 in IMA architectures?", "opts": ["Higher bandwidth, full-duplex switched Ethernet providing deterministic and flexible data exchange", "Lower cost only", "It uses only analogue signals"], "ans": 0, "exp": "AFDX มี bandwidth สูงกว่า เป็น full-duplex switched Ethernet ที่ deterministic", "hook": "AFDX = High bandwidth + Deterministic Ethernet", "module": "Module 5.15 Part 2"}, {"q": "In cabin systems, what is the purpose of active noise control?", "opts": ["To increase cabin comfort by reducing noise levels", "To increase engine noise", "To control the flight path"], "ans": 0, "exp": "ใช้ลดเสียงรบกวนเพื่อเพิ่มความสะดวกสบายในห้องโดยสาร", "hook": "Active noise control = Cabin comfort", "module": "Module 5.15 Part 2"}, {"q": "What does the term ‘federated architecture’ refer to in older avionics?", "opts": ["Each function has its own dedicated LRU with limited sharing of resources", "All functions share a single computer", "No computers are used"], "ans": 0, "exp": "Federated คือแต่ละฟังก์ชันมี LRU ของตัวเอง แชร์ทรัพยากรจำกัด", "hook": "Federated = Dedicated LRUs", "module": "Module 5.15 Part 2"}, {"q": "What is the role of the configuration database in the Cabin Service System?", "opts": ["It sets the behaviour and options of the cabin service system controller", "It stores only passenger names", "It controls the engines"], "ans": 0, "exp": "Configuration database กำหนดพฤติกรรมและตัวเลือกของระบบ", "hook": "Config database = Sets CSS behaviour", "module": "Module 5.15 Part 2"}, {"q": "Why is continuous monitoring by BITE important in modern digital aircraft systems?", "opts": ["It allows early detection of faults and supports efficient maintenance planning", "It is only used once a year", "It replaces the need for any pilot action"], "ans": 0, "exp": "ช่วยตรวจจับ fault ได้เร็วและสนับสนุนการวางแผนบำรุงรักษา", "hook": "BITE continuous = Early fault detection", "module": "Module 5.15 Part 2"}, {"q": "What three main system functions does the FMS perform?", "opts": ["Navigation, Performance and Guidance", "Only Navigation and Communication", "Only Engine and Fuel management"], "ans": 0, "exp": "FMS มีหน้าที่หลัก 3 อย่างคือ Navigation, Performance และ Guidance", "hook": "FMS = Navigation + Performance + Guidance", "module": "Module 5.15 Part 3"}, {"q": "How does the FMS measure the aircraft’s position, direction and velocity using Navaids?", "opts": ["By automatically tuning ILS, VOR and DME from its database and using the resulting measurements", "By using only the magnetic compass", "By using only inertial sensors without radio aids"], "ans": 0, "exp": "FMS tune Navaids อัตโนมัติจาก database แล้วใช้วัดตำแหน่ง ทิศทาง และความเร็ว", "hook": "FMS auto-tunes ILS/VOR/DME for position", "module": "Module 5.15 Part 3"}, {"q": "What does the Performance function of the FMS calculate?", "opts": ["A vertical profile giving the shortest possible flying time at the lowest fuel consumption", "Only the maximum take-off weight", "Only the current fuel flow"], "ans": 0, "exp": "คำนวณ vertical profile ที่ใช้เวลาน้อยและเชื้อเพลิงน้อยที่สุด", "hook": "Performance = Min time + Min fuel vertical profile", "module": "Module 5.15 Part 3"}, {"q": "What predictions can the FMS provide at future points in the flight plan?", "opts": ["Fuel quantities and arrival times", "Only the current wind", "Only the outside air temperature"], "ans": 0, "exp": "ทำนายปริมาณเชื้อเพลิงและเวลาถึงจุดต่าง ๆ ใน flight plan", "hook": "FMS predicts fuel + ETA at waypoints", "module": "Module 5.15 Part 3"}, {"q": "What does the Guidance function of the FMS do when the aircraft is not on the flight plan?", "opts": ["It gives steering and thrust commands to the AFS to bring the aircraft back to the flight plan", "It only displays a warning", "It shuts down the autopilot"], "ans": 0, "exp": "ส่งคำสั่งเลี้ยวและแรงขับไปยัง AFS เพื่อกลับเข้า flight plan", "hook": "Guidance = Steering + Thrust commands to AFS", "module": "Module 5.15 Part 3"}, {"q": "Where does the FMS show the selected flight plan to the crew?", "opts": ["On the Control Display Unit (CDU)", "Only on the Primary Flight Display", "Only on the audio panel"], "ans": 0, "exp": "แสดงบน CDU", "hook": "Flight plan display = CDU", "module": "Module 5.15 Part 3"}, {"q": "How can the crew modify the flight plan in the FMS?", "opts": ["Through the keyboard of the CDU", "Only by voice recognition", "Only on the ground before departure"], "ans": 0, "exp": "แก้ไขผ่านคีย์บอร์ดของ CDU", "hook": "Change flight plan = CDU keyboard", "module": "Module 5.15 Part 3"}, {"q": "To which system does the FMS send steering and thrust commands for automatic flight?", "opts": ["The Auto Flight System (AFS)", "Only the hydraulic system", "Only the cabin pressure system"], "ans": 0, "exp": "ส่งไปยัง Auto Flight System (AFS)", "hook": "FMS → AFS for automatic tracking", "module": "Module 5.15 Part 3"}, {"q": "What information does the FMS provide to the EFIS?", "opts": ["Flight plan data to be shown on the Navigation Display", "Only engine parameters", "Only radio frequencies"], "ans": 0, "exp": "ส่งข้อมูล flight plan ไปแสดงบน ND", "hook": "FMS → EFIS ND", "module": "Module 5.15 Part 3"}, {"q": "How does the FMS develop a position more accurate than any single sensor?", "opts": ["By blending inputs from IRS, GPS, VOR, DME and other available sensors", "By using only one GPS receiver", "By ignoring radio navaids completely"], "ans": 0, "exp": "ผสมข้อมูลจากหลายเซ็นเซอร์ (IRS, GPS, VOR, DME)", "hook": "FMS blends multiple sensors for best position", "module": "Module 5.15 Part 3"}, {"q": "What two types of flight plan does the FMS create?", "opts": ["Lateral flight plan to destination and vertical flight plan to cruise altitude", "Only a lateral plan", "Only a fuel plan"], "ans": 0, "exp": "สร้างทั้ง lateral และ vertical flight plan", "hook": "Lateral + Vertical flight plan", "module": "Module 5.15 Part 3"}, {"q": "What does a lateral flight plan consist of?", "opts": ["Flight legs to which speeds and altitudes are added to form the vertical plan", "Only radio frequencies", "Only fuel tank quantities"], "ans": 0, "exp": "ประกอบด้วย flight legs ที่มี speed และ altitude ประกอบเป็น vertical plan", "hook": "Legs + Speeds + Altitudes", "module": "Module 5.15 Part 3"}, {"q": "What signals does the FMS provide for automatic tracking of the flight plan?", "opts": ["Signals to the autopilot and autothrottle", "Only signals to the landing gear", "Only signals to the cabin lights"], "ans": 0, "exp": "ส่งสัญญาณไปยัง autopilot และ autothrottle", "hook": "FMS → Autopilot + Autothrottle", "module": "Module 5.15 Part 3"}, {"q": "What is the role of the FMGC in relation to the IRS?", "opts": ["It provides initialization data for IRS alignment via the MCDU", "It replaces the IRS completely", "It only controls the engines"], "ans": 0, "exp": "FMGC ให้ข้อมูลเริ่มต้นสำหรับ align IRS ผ่าน MCDU", "hook": "FMGC → IRS alignment initialization", "module": "Module 5.15 Part 3"}, {"q": "If FMGC input for IRS alignment has failed, what can provide initialization instead?", "opts": ["The ADIRS CDU", "Only the magnetic compass", "Only the GPS"], "ans": 0, "exp": "ADIRS CDU สามารถให้ initialization แทนได้", "hook": "ADIRS CDU = Backup for IRS init", "module": "Module 5.15 Part 3"}, {"q": "What data does a modern IRS typically output?", "opts": ["Attitude (pitch, roll), body angular rates, inertial velocity, navigation position, wind data and calculated flight path data", "Only magnetic heading", "Only airspeed"], "ans": 0, "exp": "IRS ให้ attitude, rates, velocity, position, wind และ flight path data", "hook": "IRS outputs = Attitude + Velocity + Position + Wind", "module": "Module 5.15 Part 3"}, {"q": "What are the typical body angular rates measured by the IRS?", "opts": ["Pitch, roll and yaw rates", "Only pitch rate", "Only yaw rate"], "ans": 0, "exp": "วัดอัตราการหมุนในแกน pitch, roll และ yaw", "hook": "Angular rates = Pitch + Roll + Yaw", "module": "Module 5.15 Part 3"}, {"q": "What inertial velocity components does the IRS provide?", "opts": ["North-South, East-West, ground speed, track angle and vertical rate", "Only indicated airspeed", "Only Mach number"], "ans": 0, "exp": "ให้ความเร็วเหนือ-ใต้ ตะวันออก-ตะวันตก ground speed, track และ vertical rate", "hook": "Inertial velocity = N-S, E-W, GS, Track, VS", "module": "Module 5.15 Part 3"}, {"q": "What navigation position data does the IRS provide?", "opts": ["Latitude, longitude and inertial altitude", "Only altitude from the barometric altimeter", "Only magnetic variation"], "ans": 0, "exp": "ให้ latitude, longitude และ inertial altitude", "hook": "IRS position = Lat + Lon + Inertial altitude", "module": "Module 5.15 Part 3"}, {"q": "What wind data can the IRS calculate?", "opts": ["Wind speed, wind angle and drift angle", "Only outside air temperature", "Only static pressure"], "ans": 0, "exp": "คำนวณความเร็วลม ทิศทางลม และ drift angle", "hook": "IRS wind = Speed + Angle + Drift", "module": "Module 5.15 Part 3"}, {"q": "What is required for IRS alignment?", "opts": ["A known stationary position and heading reference, normally performed on the ground", "Only a GPS signal in the air", "No special procedure is required"], "ans": 0, "exp": "ต้องมีตำแหน่งและ heading ที่ทราบขณะหยุดนิ่ง มักทำบนพื้น", "hook": "Align = Known position + heading on ground", "module": "Module 5.15 Part 3"}, {"q": "What is the purpose of the IRS Mode Select Unit (MSU)?", "opts": ["To select operating modes such as OFF, ALIGN, NAV and ATT", "To tune the VHF radios", "To control cabin temperature"], "ans": 0, "exp": "ใช้เลือกโหมดการทำงานของ IRS", "hook": "MSU = Mode selection (OFF/ALIGN/NAV/ATT)", "module": "Module 5.15 Part 3"}, {"q": "What does ATT mode of the IRS provide if full navigation capability is lost?", "opts": ["Attitude and heading information even when position data is degraded", "Only position data", "Only airspeed data"], "ans": 0, "exp": "โหมด ATT ยังให้ attitude และ heading ได้แม้ position เสีย", "hook": "ATT mode = Attitude + Heading retained", "module": "Module 5.15 Part 3"}, {"q": "What is the CFDIU used for in relation to the IRS?", "opts": ["Centralised Fault Display Interface Unit – a maintenance tool for troubleshooting", "Only for passenger announcements", "Only for loading the flight plan"], "ans": 0, "exp": "CFDIU เป็นเครื่องมือซ่อมบำรุงสำหรับ troubleshooting", "hook": "CFDIU = Maintenance troubleshooting tool", "module": "Module 5.15 Part 3"}, {"q": "What discrete outputs does the IRS provide for crew awareness?", "opts": ["Signals that turn on IRS FAULT and ALIGN lights", "Only engine fire lights", "Only cabin pressure warnings"], "ans": 0, "exp": "ส่งสัญญาณเปิดไฟ FAULT และ ALIGN", "hook": "IRS lights = FAULT + ALIGN", "module": "Module 5.15 Part 3"}, {"q": "What is an ADIRS?", "opts": ["Air Data and Inertial Reference System – a combined unit providing both air data and inertial data", "Only an inertial system", "Only an air data computer"], "ans": 0, "exp": "ADIRS รวม Air Data กับ Inertial Reference ไว้ในหน่วยเดียว", "hook": "ADIRS = Air Data + IRS combined", "module": "Module 5.15 Part 3"}, {"q": "Where does the IRS send its output data?", "opts": ["To the EFIS, Auto Flight System and other users needing air data and inertial information", "Only to the cabin system", "Only to the TCAS"], "ans": 0, "exp": "ส่งไปยัง EFIS, AFS และผู้ใช้ข้อมูลอื่น ๆ", "hook": "IRS outputs → EFIS + AFS + other users", "module": "Module 5.15 Part 3"}, {"q": "What type of gyros are commonly used in modern IRS units?", "opts": ["Laser gyros (ring laser gyros) or fibre-optic gyros", "Only mechanical spinning-mass gyros", "Only accelerometers without gyros"], "ans": 0, "exp": "ใช้ laser gyro หรือ fibre-optic gyro", "hook": "Modern IRS = Laser / FOG", "module": "Module 5.15 Part 3"}, {"q": "How many display modes does ECAM have?", "opts": ["Four – three automatic and one manual", "Only two", "Only one continuous mode"], "ans": 0, "exp": "มี 4 โหมด: 3 อัตโนมัติ + 1 manual", "hook": "ECAM = 4 modes (3 auto + 1 manual)", "module": "Module 5.15 Part 3"}, {"q": "What are the three automatic ECAM display modes?", "opts": ["Flight phase-related, advisory (mode and status), and failure-related modes", "Only take-off and landing", "Only engine start modes"], "ans": 0, "exp": "โหมดอัตโนมัติคือ flight phase, advisory และ failure-related", "hook": "Auto modes = Phase + Advisory + Failure", "module": "Module 5.15 Part 3"}, {"q": "Which ECAM mode takes precedence over the others?", "opts": ["The failure-related mode", "The manual mode", "The advisory mode"], "ans": 0, "exp": "Failure-related mode มีลำดับความสำคัญสูงสุด", "hook": "Failure mode = Highest priority", "module": "Module 5.15 Part 3"}, {"q": "In normal operation, which ECAM mode is used?", "opts": ["The automatic flight phase-related mode", "Only the manual mode", "Only the failure mode"], "ans": 0, "exp": "ใช้โหมด flight phase-related อัตโนมัติ", "hook": "Normal = Flight phase-related mode", "module": "Module 5.15 Part 3"}, {"q": "What flight phases are recognised by the ECAM flight phase-related mode?", "opts": ["Pre-flight, take-off, climb, cruise, descent, approach and after landing", "Only take-off and landing", "Only cruise"], "ans": 0, "exp": "ครอบคลุม pre-flight ถึง after landing", "hook": "Phases = Pre-flight → After landing", "module": "Module 5.15 Part 3"}, {"q": "In the flight phase-related mode, what does the left/upper ECAM display typically show?", "opts": ["An advisory memo mode", "Only a systems diagram", "Only engine parameters"], "ans": 0, "exp": "จอซ้าย/บนแสดง advisory memo", "hook": "Left/Upper = Advisory memo", "module": "Module 5.15 Part 3"}, {"q": "In the flight phase-related mode, what does the right/lower ECAM display typically show?", "opts": ["A diagram of the aircraft’s fuselage, doors and escape slide arming", "Only text warnings", "Only the flight plan"], "ans": 0, "exp": "จอขวา/ล่างแสดงภาพลำตัว ประตู และสไลด์", "hook": "Right/Lower = Fuselage/doors/slides diagram", "module": "Module 5.15 Part 3"}, {"q": "How are single-system warnings signified on ECAM by convention?", "opts": ["By underlining the system title displayed", "By flashing the entire screen", "By a continuous aural tone only"], "ans": 0, "exp": "คำเตือนระบบเดียวจะขีดเส้นใต้ชื่อระบบ", "hook": "Single system = Underlined title", "module": "Module 5.15 Part 3"}, {"q": "How are warnings that can affect other subsystems shown on ECAM?", "opts": ["The title of the sub-system is shown ‘boxed’", "Only by underlining", "Only by a red light"], "ans": 0, "exp": "ชื่อระบบย่อยจะถูกใส่กรอบ (boxed)", "hook": "Affecting other systems = Boxed title", "module": "Module 5.15 Part 3"}, {"q": "How are warnings and associated lights cleared on ECAM?", "opts": ["By means of ‘CLEAR’ push-button switches on the ECAM control panel or a warning light display panel", "Automatically after 5 seconds", "Only by resetting the circuit breakers"], "ans": 0, "exp": "กดปุ่ม CLEAR บน ECAM control panel หรือแผงไฟเตือน", "hook": "Clear warnings = CLEAR push-button", "module": "Module 5.15 Part 3"}, {"q": "What do status messages on the left/upper ECAM display provide?", "opts": ["An operational summary of the aircraft’s condition, possible downgrading of autoland capability, and status after failures", "Only the current fuel quantity", "Only the passenger count"], "ans": 0, "exp": "สรุปสถานะเครื่องบิน การลดความสามารถ autoland และสถานะหลัง failure", "hook": "Status = Aircraft condition + Autoland capability", "module": "Module 5.15 Part 3"}, {"q": "What does the manual ECAM mode allow the pilot to select?", "opts": ["Diagrams of any one of 12 aircraft systems for routine checking, and status messages if no warnings are triggered", "Only the engine start sequence", "Only the weather radar"], "ans": 0, "exp": "เลือกดู diagram ของระบบใดระบบหนึ่งจาก 12 ระบบได้", "hook": "Manu /* ========== STATE ========== */
let quiz = [];          // shuffled questions with shuffled options
let submitted = false;
let currentFilter = "all";

/* ========== UTILS ========== */
function shuffle(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function buildQuiz() {
  // Shuffle question order
  const shuffledQ = shuffle(RAW_QUESTIONS);
  quiz = shuffledQ.map((q, idx) => {
    // Shuffle options, keep track of correct answer text
    const correctText = q.opts[q.ans];
    const shuffledOpts = shuffle(q.opts);
    const newAns = shuffledOpts.indexOf(correctText);
    return {
      id: idx,
      q: q.q,
      opts: shuffledOpts,
      ans: newAns,
      exp: q.exp || "",
      hook: q.hook || "",
      module: q.module || "",
      userAns: null
    };
  });
  submitted = false;
  currentFilter = "all";
  document.getElementById("totalCount").textContent = quiz.length;
  document.getElementById("filterGroup").classList.remove("active");
  document.getElementById("scorePanel").classList.remove("show");
  document.getElementById("footerActions").classList.remove("hidden");
  document.getElementById("btnSubmit").disabled = false;
  renderQuiz();
  updateProgress();
}

function updateProgress() {
  const answered = quiz.filter(q => q.userAns !== null).length;
  document.getElementById("progressText").textContent =
    "ตอบแล้ว " + answered + " / " + quiz.length;
}

function renderQuiz() {
  const area = document.getElementById("quizArea");
  area.innerHTML = "";

  quiz.forEach((item, i) => {
    // Filter logic after submit
    if (submitted) {
      const isCorrect = item.userAns === item.ans;
      if (currentFilter === "correct" && !isCorrect) return;
      if (currentFilter === "wrong" && isCorrect) return;
    }

    const card = document.createElement("div");
    card.className = "question-card";
    card.dataset.qid = i;

    if (submitted) {
      if (item.userAns === item.ans) card.classList.add("correct-card");
      else card.classList.add("wrong-card");
    }

    let html = '<div class="q-text">' + (i + 1) + '. ' + escapeHtml(item.q) + '</div>';
    html += '<ul class="options">';

    item.opts.forEach((opt, oi) => {
      const letter = String.fromCharCode(97 + oi); // a b c
      const checked = item.userAns === oi ? " checked" : "";
      const disabled = submitted ? " disabled" : "";
      html += '<li><label>';
      html += '<input type="radio" name="q' + i + '" value="' + oi + '"' + checked + disabled + '>';
      html += '<span class="opt-text">' + letter + '. ' + escapeHtml(opt) + '</span>';
      html += '</label></li>';
    });
    html += '</ul>';

    // Result box (shown after submit)
    if (submitted) {
      const correctLetter = String.fromCharCode(97 + item.ans);
      const correctText = item.opts[item.ans];
      html += '<div class="result-box show">';
      html += '<div class="ans-label">คำตอบ : ' + correctLetter + '. ' + escapeHtml(correctText) + '</div>';
      if (item.exp) {
        html += '<div class="exp"><strong>คำอธิบาย :</strong> ' + escapeHtml(item.exp) + '</div>';
      }
      if (item.hook) {
        html += '<div class="hook"><strong>เทคนิคจำ :</strong> ' + escapeHtml(item.hook) + '</div>';
      }
      html += '</div>';
    }

    card.innerHTML = html;
    area.appendChild(card);
  });

  // Attach change listeners if not submitted
  if (!submitted) {
    area.querySelectorAll('input[type="radio"]').forEach(radio => {
      radio.addEventListener("change", function() {
        const qid = parseInt(this.name.replace("q", ""), 10);
        quiz[qid].userAns = parseInt(this.value, 10);
        updateProgress();
      });
    });
  }
}

function escapeHtml(str) {
  if (!str) return "";
  return String(str)
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;");
}

function submitQuiz() {
  // Check if all answered
  const unanswered = quiz.filter(q => q.userAns === null).length;
  if (unanswered > 0) {
    const ok = confirm("ยังมีข้อที่ยังไม่ได้ตอบ " + unanswered + " ข้อ\nต้องการส่งคำตอบเลยหรือไม่?");
    if (!ok) return;
  }

  submitted = true;
  let correct = 0;
  quiz.forEach(q => {
    if (q.userAns === q.ans) correct++;
  });
  const total = quiz.length;
  const pct = total > 0 ? Math.round((correct / total) * 100) : 0;

  // Score panel
  const panel = document.getElementById("scorePanel");
  const scoreVal = document.getElementById("scoreValue");
  const scoreDetail = document.getElementById("scoreDetail");
  const scoreBar = document.getElementById("scoreBar");

  scoreVal.textContent = pct + "%";
  scoreDetail.textContent = "ถูก " + correct + " จาก " + total + " ข้อ";

  scoreBar.style.width = pct + "%";
  scoreBar.classList.remove("green", "yellow", "red");
  if (pct >= 76) {
    scoreBar.classList.add("green");
    scoreVal.style.color = "#276749";
  } else if (pct >= 60) {
    scoreBar.classList.add("yellow");
    scoreVal.style.color = "#d69e2e";
  } else {
    scoreBar.classList.add("red");
    scoreVal.style.color = "#c53030";
  }

  panel.classList.add("show");
  document.getElementById("filterGroup").classList.add("active");
  document.getElementById("btnSubmit").disabled = true;

  // Reset filter buttons
  document.querySelectorAll(".filter-btn").forEach(b => b.classList.remove("active"));
  document.querySelector('.filter-btn[data-filter="all"]').classList.add("active");
  currentFilter = "all";

  renderQuiz();
  // Scroll to score
  panel.scrollIntoView({ behavior: "smooth", block: "start" });
}

function resetQuiz() {
  buildQuiz();
  window.scrollTo({ top: 0, behavior: "smooth" });
}

/* ========== EVENTS ========== */
document.getElementById("btnSubmit").addEventListener("click", submitQuiz);
document.getElementById("btnReset").addEventListener("click", resetQuiz);

document.querySelectorAll(".filter-btn").forEach(btn => {
  btn.addEventListener("click", function() {
    document.querySelectorAll(".filter-btn").forEach(b => b.classList.remove("active"));
    this.classList.add("active");
    currentFilter = this.dataset.filter;
    renderQuiz();
  });
});

/* ========== INIT ========== */
buildQuiz();
</script>
</body>
</html>
