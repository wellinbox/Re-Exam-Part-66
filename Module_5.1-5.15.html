D have in case of an MFD failure?", "opts": ["It shuts down completely", "A “reversionary mode” capable of displaying all information normally shown on the MFD", "It can only show a blank screen"], "ans": 1, "exp": "PFD มี reversionary mode ที่แสดงข้อมูลของ MFD ได้เมื่อ MFD เสีย", "hook": "Reversionary mode = PFD แสดงแทน MFD", "module": "Module 5.1"}, {"q": "What does the Multi-function display of the G1000 typically show?", "opts": ["Only the attitude indicator", "Only radio frequencies", "A moving map on the right side and engine instrumentation on the left"], "ans": 2, "exp": "MFD แสดง moving map ด้านขวาและ engine instrumentation ด้านซ้าย", "hook": "MFD = Engine left + Map right", "module": "Module 5.1"}, {"q": "How are most of the other screens in the G1000 system accessed from the MFD?", "opts": ["By turning the knob on the lower right corner of the unit", "By pressing only the power button", "By removing the SD cards"], "ans": 0, "exp": "หมุนปุ่มที่มุมล่างขวาเพื่อเข้าถึงหน้าจออื่น ๆ", "hook": "MFD pages = turn lower-right knob", "module": "Module 5.1"}, {"q": "The buttons on the G1000 PFD are used to set what?", "opts": ["Only the cabin temperature", "Only the fuel quantity", "The squawk code on the transponder"], "ans": 2, "exp": "ปุ่มบน PFD ใช้ตั้ง squawk code ของ transponder", "hook": "PFD buttons = Transponder squawk", "module": "Module 5.1"}, {"q": "In the G1000 system, how are all the displays within an aircraft interconnected?", "opts": ["Using only analogue wires", "Using only pneumatic tubes", "Using a high-speed Ethernet data bus"], "ans": 2, "exp": "จอทั้งหมดเชื่อมต่อกันด้วย high-speed Ethernet data bus", "hook": "G1000 displays = Ethernet bus", "module": "Module 5.1"}, {"q": "What does the air data computer (ADC) measure?", "opts": ["Airspeed, altitude, vertical speed and outside air temperature", "Only magnetic heading", "Only engine RPM"], "ans": 0, "exp": "ADC วัด airspeed, altitude, vertical speed และ OAT", "hook": "ADC = Air data (speed, alt, VS, OAT)", "module": "Module 5.1"}, {"q": "What technology does the ADC unit use for its pressure sensors?", "opts": ["Solid state MEMS technology (piezoelectric pressure sensors)", "Only mechanical aneroid capsules", "Only liquid mercury columns"], "ans": 0, "exp": "ADC ใช้ MEMS piezoelectric pressure sensors", "hook": "ADC sensors = MEMS solid state", "module": "Module 5.1"}, {"q": "What does the Attitude and Heading Reference System (AHRS) measure using solid-state sensors?", "opts": ["Aircraft attitude, rate of turn, and slip and skid", "Only outside air temperature", "Only fuel flow"], "ans": 0, "exp": "AHRS วัด attitude, rate of turn และ slip/skid ด้วย MEMS", "hook": "AHRS = Attitude + Rate + Slip/Skid", "module": "Module 5.1"}, {"q": "Where is the magnetometer normally located and why?", "opts": ["At a remote part of the aircraft airframe (usually a wing tip) far from electrical components that may cause magnetic deviation", "Inside the instrument panel next to the PFD", "Inside the engine nacelle"], "ans": 0, "exp": "Magnetometer ติดตั้งห่างจากส่วนไฟฟ้า (มักที่ปลายปีก) เพื่อลด magnetic deviation", "hook": "Magnetometer = wing tip (away from electrical)", "module": "Module 5.1"}, {"q": "What does the magnetometer provide to the AHRS?", "opts": ["Only airspeed data", "A reference to the earth’s magnetic field for the heading gyro", "Only altitude data"], "ans": 1, "exp": "Magnetometer ให้ reference ของสนามแม่เหล็กโลกแก่ heading gyro ใน AHRS", "hook": "Magnetometer = magnetic reference for AHRS gyro", "module": "Module 5.1"}, {"q": "Some EFIS manufacturers combine the AHRS and ADC into one unit called what?", "opts": ["Only an audio panel", "Only a transponder", "ADAHRS (Air Data and Attitude and Heading Reference System)"], "ans": 2, "exp": "บางผู้ผลิตรวม AHRS + ADC เป็น ADAHRS", "hook": "ADAHRS = ADC + AHRS combined", "module": "Module 5.1"}, {"q": "In the Genesys Aerosystems IDU 680 EFIS, how many display areas does each display unit have?", "opts": ["Two display areas (upper and lower half of the screen)", "Only one full-screen area", "Four equal quadrants"], "ans": 0, "exp": "แต่ละ display unit ของ IDU 680 แบ่งเป็น upper และ lower half", "hook": "IDU 680 = upper + lower half per unit", "module": "Module 5.1"}, {"q": "In a Genesys IDU 680 dual EFIS installation, which half-screens are always fixed as PFDs?", "opts": ["The upper outboard half-screens", "The lower inboard half-screens", "Any half-screen chosen by the pilot"], "ans": 0, "exp": "Upper outboard ถูก fix เป็น PFD และย้ายไม่ได้", "hook": "IDU 680 PFD = upper outboard (fixed)", "module": "Module 5.1"}, {"q": "What is a key architectural difference of the Genesys IDU 680 compared with the Garmin G1000 regarding the processor and sensors?", "opts": ["All processors are completely external and separate", "No GPS capability is provided", "Processors are integrated into the back of the display units and GPS/ADAHRS plug directly into them"], "ans": 2, "exp": "Processor รวมอยู่ในหลังจอ และ GPS/ADAHRS เสียบตรงเข้าไปได้", "hook": "IDU 680 = integrated processors + plug-in modules", "module": "Module 5.1"}, {"q": "What is ACARS?", "opts": ["A digital datalink system for transmission of short messages between aircraft and ground stations via airband radio or satellite", "An analogue voice communication system only", "A purely satellite navigation system"], "ans": 0, "exp": "ACARS เป็นระบบ digital datalink สำหรับส่งข้อความสั้นระหว่างเครื่องบินกับสถานีภาคพื้นผ่าน radio หรือ satellite", "hook": "ACARS = Digital short messages (radio/satellite)", "module": "Module 5.15 Part 1"}, {"q": "Who designed the original ACARS protocol and in what year was it deployed?", "opts": ["ARINC in 1978 using the Telex format", "SITA in 1985 using binary format", "ICAO in 1990 using HF only"], "ans": 0, "exp": "โปรโตคอลออกแบบโดย ARINC และเริ่มใช้ปี 1978 ในรูปแบบ Telex", "hook": "ARINC 1978 = Telex format", "module": "Module 5.15 Part 1"}, {"q": "For what purposes is ACARS dedicated?", "opts": ["Maintenance, operation and commercial purposes", "Only passenger entertainment", "Only military communications"], "ans": 0, "exp": "ACARS ใช้เพื่อ maintenance, operation และ commercial", "hook": "ACARS = Maintenance + Ops + Commercial", "module": "Module 5.15 Part 1"}, {"q": "How are ground-to-air and air-to-ground ACARS messages transmitted when VHF is not available?", "opts": ["Via the SATCOM system", "Via HF voice only", "Via optical links"], "ans": 0, "exp": "เมื่อ VHF ใช้ไม่ได้ จะส่งผ่าน SATCOM", "hook": "VHF fail → SATCOM", "module": "Module 5.15 Part 1"}, {"q": "Where is the transmitted ACARS information relayed for conversion into airline messages?", "opts": ["To a central computer (Singapore for SITA or Chicago for ARINC)", "Directly to the pilot’s headset", "Only to the nearest airport tower"], "ans": 0, "exp": "ข้อมูลถูกส่งต่อไปยังคอมพิวเตอร์กลางที่ Singapore (SITA) หรือ Chicago (ARINC)", "hook": "SITA Singapore / ARINC Chicago", "module": "Module 5.15 Part 1"}, {"q": "Which organisation operates ACARS?", "opts": ["ARINC (Aeronautical Radio Incorporated)", "SITA only", "ICAO only"], "ans": 0, "exp": "ARINC เป็นผู้ให้บริการ ACARS", "hook": "ARINC = ACARS, SITA = AIRCOM", "module": "Module 5.15 Part 1"}, {"q": "Which organisation operates AIRCOM?", "opts": ["SITA (Société International de Télécommunication Aérienne)", "ARINC only", "FAA only"], "ans": 0, "exp": "SITA ให้บริการ AIRCOM", "hook": "SITA = AIRCOM (Europe)", "module": "Module 5.15 Part 1"}, {"q": "Prior to ACARS, how was communication between aircraft and ground personnel mainly performed?", "opts": ["By the flight crew using voice communication (VHF or HF)", "By automatic digital messages only", "By written paper notes only"], "ans": 0, "exp": "ก่อนมี ACARS ใช้การสื่อสารด้วยเสียงผ่าน VHF หรือ HF", "hook": "Before ACARS = Voice only", "module": "Module 5.15 Part 1"}, {"q": "ACARS can manage both transmission and reception of data. True or false according to the notes?", "opts": ["True – it manages both", "False – only transmission", "False – only reception"], "ans": 0, "exp": "เอกสารระบุชัดว่า ACARS จัดการทั้งการส่งและรับข้อมูล", "hook": "ACARS = Tx + Rx", "module": "Module 5.15 Part 1"}, {"q": "What type of messages can ACARS transmit or receive?", "opts": ["Automatically or manually generated reports or messages", "Only automatic engine parameters", "Only passenger lists"], "ans": 0, "exp": "สามารถส่ง/รับทั้งข้อความที่สร้างอัตโนมัติและด้วยมือ", "hook": "Auto or Manual messages", "module": "Module 5.15 Part 1"}, {"q": "A ground network transmits ACARS data from the ground receiver to which location?", "opts": ["The airline main base", "Only the aircraft manufacturer", "Only ATC centres"], "ans": 0, "exp": "เครือข่ายภาคพื้นส่งข้อมูลไปยัง airline main base", "hook": "Ground network → Airline main base", "module": "Module 5.15 Part 1"}, {"q": "In which regions does SITA and ARINC primarily operate their ground networks for ACARS/AIRCOM?", "opts": ["SITA for EUROPE, ARINC for the USA", "Both only in Asia", "Both only in the USA"], "ans": 0, "exp": "SITA ดูแลยุโรป ส่วน ARINC ดูแลสหรัฐฯ", "hook": "SITA Europe / ARINC USA", "module": "Module 5.15 Part 1"}, {"q": "What does EICAS stand for?", "opts": ["Engine Indication and Crew Alerting System", "Electronic Instrument Control Alert System", "Engine Integrated Control and Alert System"], "ans": 0, "exp": "EICAS = Engine Indication and Crew Alerting System", "hook": "EICAS = Engine + Crew Alerting (Boeing)", "module": "Module 5.15 Part 1"}, {"q": "On EICAS equipped aircraft, engine operating data is displayed on what type of units?", "opts": ["LCD display units (DUs)", "Only mechanical gauges", "Only CRT units"], "ans": 0, "exp": "ข้อมูลเครื่องยนต์แสดงบน LCD display units", "hook": "EICAS = LCD DUs", "module": "Module 5.15 Part 1"}, {"q": "What happens automatically when malfunctions occur in an EICAS system?", "opts": ["The flight crew’s attention is drawn by an automatic display of messages in the appropriate colours", "All displays go blank", "Only a single red light illuminates"], "ans": 0, "exp": "เมื่อเกิด malfunction ระบบจะแสดงข้อความสีที่เหมาะสมโดยอัตโนมัติ", "hook": "Malfunction → Auto coloured messages", "module": "Module 5.15 Part 1"}, {"q": "EICAS provides the flight crew with primary engine parameters on what basis?", "opts": ["Full-time display", "Only during take-off", "Only when selected by the pilot"], "ans": 0, "exp": "Primary engine parameters แสดงตลอดเวลา (full-time)", "hook": "Primary = Full-time", "module": "Module 5.15 Part 1"}, {"q": "Secondary engine parameters and advisory/caution warning alert messages on EICAS are displayed how?", "opts": ["As required", "Full-time like primary parameters", "Never displayed"], "ans": 0, "exp": "Secondary และ alert messages แสดงตามความจำเป็น", "hook": "Secondary = As required", "module": "Module 5.15 Part 1"}, {"q": "Operating in conjunction with EICAS are discrete caution and warning lights plus which standby device?", "opts": ["Standby engine indicators", "Only a magnetic compass", "Only a mechanical altimeter"], "ans": 0, "exp": "มี standby engine indicators ร่วมด้วย", "hook": "EICAS + Standby engine indicators", "module": "Module 5.15 Part 1"}, {"q": "Where is the panel for selecting maintenance data displays located relative to the main EICAS displays?", "opts": ["Remotely-located panel", "On the primary flight display", "On the glare shield only"], "ans": 0, "exp": "แผงเลือก maintenance data อยู่ตำแหน่ง remote", "hook": "Maintenance panel = Remote", "module": "Module 5.15 Part 1"}, {"q": "In early EICAS systems on the Boeing 757/767, how many display units were typically used?", "opts": ["Two display units (one active, one standby)", "Four identical units", "Only one unit"], "ans": 0, "exp": "มีสองจอ หนึ่งทำงานหนึ่ง standby", "hook": "Early EICAS = Dual DU (active/standby)", "module": "Module 5.15 Part 1"}, {"q": "What is the main difference in philosophy between early EICAS and early ECAM regarding engine data display?", "opts": ["EICAS displays engine data as required while ECAM retained traditional instruments because engine data was considered needed for the whole flight", "Both systems eliminated all traditional instruments from the start", "ECAM never displays engine data"], "ans": 0, "exp": "EICAS แสดงตามต้องการ ส่วน ECAM ยุคแรกยังเก็บเกจเครื่องยนต์เพราะมองว่าต้องแสดงตลอด", "hook": "EICAS = on demand, early ECAM = continuous instruments", "module": "Module 5.15 Part 1"}, {"q": "EICAS eliminates the need for which traditional items?", "opts": ["Traditional engine instruments", "All navigation displays", "The autopilot"], "ans": 0, "exp": "EICAS ช่วยลดความจำเป็นของเกจเครื่องยนต์แบบดั้งเดิม", "hook": "EICAS replaces traditional engine instruments", "module": "Module 5.15 Part 1"}, {"q": "Alert messages on EICAS are shown in what form?", "opts": ["A list of messages in a small window near the other EICAS indications", "Only flashing lights without text", "Only aural warnings"], "ans": 0, "exp": "แสดงเป็นรายการข้อความในหน้าต่างเล็กใกล้จอ EICAS", "hook": "CAS = Message list", "module": "Module 5.15 Part 1"}, {"q": "What type of data acquisition does EICAS provide?", "opts": ["High connectivity with data acquisition and routing", "Only local display without routing", "Only voice recording"], "ans": 0, "exp": "EICAS มี connectivity สูงและทำ data acquisition + routing", "hook": "EICAS = Data acquisition + routing", "module": "Module 5.15 Part 1"}, {"q": "System synoptics on EICAS are displayed on which screens?", "opts": ["The main and auxiliary screens", "Only the PFD", "Only the ND"], "ans": 0, "exp": "Synoptics แสดงบน main และ auxiliary screens", "hook": "Synoptics = EICAS main/aux", "module": "Module 5.15 Part 1"}, {"q": "In the event of a display unit failure on early dual-DU EICAS, what can happen?", "opts": ["The standby unit may be switched in either manually or automatically", "All engine data is lost permanently", "Only secondary data remains"], "ans": 0, "exp": "จอ standby สามารถสลับเข้ามาได้ทั้งด้วยมือหรืออัตโนมัติ", "hook": "DU fail → Standby switch (manual/auto)", "module": "Module 5.15 Part 1"}, {"q": "EICAS was introduced on which Boeing aircraft types according to the notes?", "opts": ["Boeing 757 and 767", "Only the Boeing 747 classic", "Only the Boeing 737-200"], "ans": 0, "exp": "EICAS เริ่มใช้บน Boeing 757 และ 767", "hook": "EICAS first = B757/B767", "module": "Module 5.15 Part 1"}, {"q": "What does FBW stand for?", "opts": ["Fly-by-wire", "Flight-by-wireless", "Fuel-by-weight"], "ans": 0, "exp": "FBW = Fly-by-wire", "hook": "FBW = บินด้วยสายไฟ (ไฟฟ้า)", "module": "Module 5.15 Part 1"}, {"q": "Which modern transport aircraft families use FBW according to the notes?", "opts": ["Airbus A318–A380, Boeing 777/787/748, Embraer ERJ-170/190, C-17", "Only the Boeing 737 classic", "Only piston-engine aircraft"], "ans": 0, "exp": "เครื่องบินรุ่นใหม่หลายตระกูลใช้ FBW รวมถึง Airbus, Boeing 777/787 และ Embraer", "hook": "Most modern jets = FBW", "module": "Module 5.15 Part 1"}, {"q": "What is one major reason manufacturers switch to FBW regarding flight test?", "opts": ["Flight test savings – software changes can solve handling problems", "It increases the number of required flight test hours", "It eliminates the need for any flight testing"], "ans": 0, "exp": "FBW ช่วยประหยัดการทดสอบบิน เพราะแก้ปัญหาด้วย software ได้", "hook": "FBW = Software solves handling problems", "module": "Module 5.15 Part 1"}, {"q": "How does FBW help achieve uniform handling characteristics across an aircraft family?", "opts": ["By allowing software-defined flying characteristics that remain consistent", "By using identical mechanical linkages on every aircraft", "By removing all flight computers"], "ans": 0, "exp": "FBW ทำให้กำหนดลักษณะการบินด้วย software ให้เหมือนกันทั้งตระกูล", "hook": "FBW = Uniform handling via software", "module": "Module 5.15 Part 1"}, {"q": "What weight and complexity savings does FBW provide when combined with FADEC?", "opts": ["Reduces the requirement for direct mechanical linkages and heavy cables", "Increases the number of mechanical cables required", "Adds more hydraulic pumps"], "ans": 0, "exp": "FBW + FADEC ลดความจำเป็นของสายเคเบิลและกลไกโดยตรง", "hook": "FBW + FADEC = Less mechanical complexity", "module": "Module 5.15 Part 1"}, {"q": "What flight envelope protections can FBW introduce?", "opts": ["Low speed (stall), over-speed, bank angle, aircraft G-factor and engine-out handling", "Only engine temperature limits", "Only cabin pressure limits"], "ans": 0, "exp": "FBW สามารถป้องกันเกินขอบเขตการบินหลายด้าน รวมถึง stall และ overspeed", "hook": "FBW protections = Stall, overspeed, bank, G, engine-out", "module": "Module 5.15 Part 1"}, {"q": "How can FBW improve fuel efficiency on aircraft such as the A380?", "opts": ["By allowing a greater aft centre of gravity position, reducing tail down force and drag", "By increasing the size of the horizontal stabiliser", "By forcing the aircraft to fly slower"], "ans": 0, "exp": "FBW ช่วยให้วาง CG ไปด้านหลังได้มากขึ้น ลดแรงกดหางและแรงต้าน", "hook": "Aft CG → less drag → better fuel burn", "module": "Module 5.15 Part 1"}, {"q": "What is lift augmentation in the context of FBW?", "opts": ["Both ailerons are symmetrically ‘drooped’ to provide additional lift when flaps are extended", "Only the elevators are moved up", "Only the rudder is deflected"], "ans": 0, "exp": "Aileron ทั้งสองข้างถูก droop พร้อมกันเพื่อเพิ่ม lift เมื่อใช้ flaps", "hook": "Drooped ailerons = extra lift", "module": "Module 5.15 Part 1"}, {"q": "In a typical Airbus FBW system, how are the flight control surfaces controlled and activated?", "opts": ["Electrically-controlled and hydraulically-activated", "Mechanically-controlled and electrically-activated", "Pneumatically-controlled and mechanically-activated"], "ans": 0, "exp": "ควบคุมด้วยไฟฟ้า และขับเคลื่อนด้วยไฮดรอลิก", "hook": "FBW = Electric control + Hydraulic actuation", "module": "Module 5.15 Part 1"}, {"q": "Which flight controls can also be mechanically controlled in the Airbus FBW system?", "opts": ["The stabiliser and rudder", "Only the ailerons", "Only the spoilers"], "ans": 0, "exp": "Stabiliser และ rudder สามารถควบคุมด้วยกลไกได้", "hook": "Stabiliser + Rudder = Mechanical backup possible", "module": "Module 5.15 Part 1"}, {"q": "What do pilots use to fly the aircraft in pitch and roll in a typical Airbus FBW system?", "opts": ["Sidesticks", "Conventional control columns only", "Only rudder pedals"], "ans": 0, "exp": "นักบินใช้ sidestick สำหรับ pitch และ roll", "hook": "Airbus FBW = Sidesticks", "module": "Module 5.15 Part 1"}, {"q": "When in normal law, what do the FBW computers prevent regardless of pilot input?", "opts": ["Excessive manoeuvres and exceedance of the safe envelope in pitch and roll", "Any movement of the control surfaces", "Only yaw movement"], "ans": 0, "exp": "ใน normal law คอมพิวเตอร์จะป้องกันการบินเกินขอบเขตที่ปลอดภัย", "hook": "Normal law = Envelope protection", "module": "Module 5.15 Part 1"}, {"q": "Does the rudder have the same envelope protection as the pitch and roll axes in normal law?", "opts": ["No – the rudder has no such protection", "Yes – identical protection", "Only protection against reverse thrust"], "ans": 0, "exp": "Rudder ไม่มีการป้องกัน envelope เหมือน pitch/roll", "hook": "Rudder = No envelope protection", "module": "Module 5.15 Part 1"}, {"q": "How is the rudder controlled for yaw damping, turn coordination and trim in the Airbus FBW system?", "opts": ["Electrically", "Only mechanically", "Only pneumatically"], "ans": 0, "exp": "Yaw damping, turn coordination และ trim ควบคุมด้วยไฟฟ้า", "hook": "Yaw functions = Electrical", "module": "Module 5.15 Part 1"}, {"q": "Speed brakes in the Airbus FBW system are controlled how?", "opts": ["Electrically", "Only mechanically", "Only by hydraulic pressure without computers"], "ans": 0, "exp": "Speed brakes ควบคุมด้วยไฟฟ้า", "hook": "Speed brakes = Electrical", "module": "Module 5.15 Part 1"}, {"q": "What is the flight management system (FMS) often described as?", "opts": ["The ‘brain’ of the aircraft navigation system", "Only a fuel quantity computer", "Only a radio tuner"], "ans": 0, "exp": "FMS ถูกเรียกว่า ‘brain’ ของระบบนำทาง", "hook": "FMS = Brain of navigation", "module": "Module 5.15 Part 1"}, {"q": "What does the FMS assist pilots with?", "opts": ["Navigation and flight preparation to compute the most efficient flight in fuel and time", "Only cabin temperature control", "Only passenger seating"], "ans": 0, "exp": "FMS ช่วยนำทางและวางแผนเที่ยวบินให้ประหยัดเชื้อเพลิงและเวลา", "hook": "FMS = Efficient navigation + performance", "module": "Module 5.15 Part 1"}, {"q": "What does the FMS compare a pilot-selected flight plan with?", "opts": ["The actual horizontal and vertical aircraft position", "Only the fuel remaining", "Only the outside air temperature"], "ans": 0, "exp": "FMS เปรียบเทียบ flight plan ที่เลือกกับตำแหน่งจริงของเครื่องบิน", "hook": "Flight plan vs Actual position", "module": "Module 5.15 Part 1"}, {"q": "If there is a difference between the selected flight plan and the aircraft position, what does the FMS do?", "opts": ["Makes a steering and a thrust command", "Shuts down the engines", "Only displays a warning light"], "ans": 0, "exp": "FMS จะสั่งการเลี้ยวและแรงขับเพื่อกลับเข้า flight plan", "hook": "Deviation → Steering + Thrust command", "module": "Module 5.15 Part 1"}, {"q": "Where does the FMS show information about the selected flight plan?", "opts": ["On the control display unit (CDU)", "Only on the primary flight display", "Only on the audio panel"], "ans": 0, "exp": "ข้อมูล flight plan แสดงบน CDU", "hook": "Flight plan = CDU", "module": "Module 5.15 Part 1"}, {"q": "How can the crew change the flight plan in the FMS?", "opts": ["Through the keyboard of the CDU", "Only by voice commands", "Only on the ground before flight"], "ans": 0, "exp": "นักบินเปลี่ยน flight plan ผ่านคีย์บอร์ดของ CDU", "hook": "CDU keyboard = Change flight plan", "module": "Module 5.15 Part 1"}, {"q": "To which system does the FMS give steering and thrust commands?", "opts": ["The auto flight system (AFS)", "Only the hydraulic system", "Only the cabin pressure system"], "ans": 0, "exp": "คำสั่งถูกส่งไปยัง Auto Flight System (AFS)", "hook": "FMS → AFS", "module": "Module 5.15 Part 1"}, {"q": "What information does the FMS give to the EFIS?", "opts": ["Information to show the flight plan on the navigation display", "Only engine oil temperature", "Only radio frequencies"], "ans": 0, "exp": "FMS ส่งข้อมูล flight plan ไปแสดงบน ND ของ EFIS", "hook": "FMS → EFIS ND (flight plan)", "module": "Module 5.15 Part 1"}, {"q": "What does the FMS use its database for regarding Navaids?", "opts": ["To automatically tune the Navaids (ILS, VOR and DME)", "Only to store passenger names", "Only to calculate fuel density"], "ans": 0, "exp": "FMS ใช้ database เพื่อ tune Navaids อัตโนมัติ", "hook": "FMS auto-tunes ILS/VOR/DME", "module": "Module 5.15 Part 1"}, {"q": "What performance calculation does the FMS perform?", "opts": ["A vertical profile that gives the shortest possible flying time at the lowest fuel consumption", "Only the maximum landing weight", "Only the centre of gravity limits"], "ans": 0, "exp": "FMS คำนวณ vertical profile ที่ประหยัดเชื้อเพลิงและเวลาที่สุด", "hook": "Vertical profile = min fuel + min time", "module": "Module 5.15 Part 1"}, {"q": "What predictions can the FMS provide?", "opts": ["Fuel quantities and arrival times at future points in the flight plan", "Only the current wind speed", "Only the cabin temperature"], "ans": 0, "exp": "FMS ทำนายปริมาณเชื้อเพลิงและเวลาถึงจุดต่าง ๆ ใน flight plan", "hook": "FMS predicts fuel + ETA", "module": "Module 5.15 Part 1"}, {"q": "How does the FMS develop a more accurate position than any single sensor?", "opts": ["By blending available inputs from long-range and short-range sensors such as IRS, GPS, VOR and DME", "By using only one GPS receiver", "By ignoring all radio navaids"], "ans": 0, "exp": "FMS ผสมข้อมูลจากหลายเซ็นเซอร์เพื่อได้ตำแหน่งที่แม่นยำกว่า", "hook": "FMS blends IRS + GPS + VOR/DME", "module": "Module 5.15 Part 1"}, {"q": "What two types of flight plan does the FMS create?", "opts": ["A lateral flight plan to the destination and a vertical flight plan to the cruise altitude", "Only a lateral plan", "Only a vertical plan"], "ans": 0, "exp": "FMS สร้างทั้ง lateral และ vertical flight plan", "hook": "Lateral + Vertical flight plan", "module": "Module 5.15 Part 1"}, {"q": "What does the lateral flight plan consist of?", "opts": ["Flight legs to which speeds and altitudes are added (forming the vertical plan)", "Only radio frequencies", "Only fuel tank quantities"], "ans": 0, "exp": "Lateral plan ประกอบด้วย flight legs ที่มี speed และ altitude ประกอบเป็น vertical plan", "hook": "Legs + Speeds + Altitudes = Full plan", "module": "Module 5.15 Part 1"}, {"q": "The FMS can provide signals to which systems for automatic tracking?", "opts": ["The autopilot and autothrottle", "Only the landing gear", "Only the cabin lights"], "ans": 0, "exp": "FMS ส่งสัญญาณไปยัง autopilot และ autothrottle เพื่อบินตามแผนอัตโนมัติ", "hook": "FMS → Autopilot + Autothrottle", "module": "Module 5.15 Part 1"}, {"q": "What does IRS stand for?", "opts": ["Inertial Reference System", "Instrument Reference System", "Integrated Radio System"], "ans": 0, "exp": "IRS = Inertial Reference System", "hook": "IRS = Inertial Reference", "module": "Module 5.15 Part 1"}, {"q": "What is the main function of an IRS?", "opts": ["To provide continuous attitude, heading and position information without external references once aligned", "To measure only airspeed", "To control the engines"], "ans": 0, "exp": "IRS ให้ข้อมูล attitude, heading และ position อย่างต่อเนื่องโดยไม่ต้องพึ่งอ้างอิงภายนอกหลัง align", "hook": "IRS = Self-contained attitude + position", "module": "Module 5.15 Part 1"}, {"q": "What sensors are typically used in a modern IRS for measuring acceleration?", "opts": ["Accelerometers", "Only pitot tubes", "Only magnetic compasses"], "ans": 0, "exp": "ใช้ accelerometer วัดความเร่ง", "hook": "IRS = Accelerometers + Gyros", "module": "Module 5.15 Part 1"}, {"q": "What is required before an IRS can provide accurate navigation data?", "opts": ["Alignment (usually on the ground)", "Only a GPS signal", "Only engine start"], "ans": 0, "exp": "ต้องทำการ align ก่อน (มักทำบนพื้น)", "hook": "IRS must be aligned first", "module": "Module 5.15 Part 1"}, {"q": "In navigate mode, what does the IRS provide?", "opts": ["Continuous position, velocity, attitude and heading information", "Only magnetic heading", "Only altitude"], "ans": 0, "exp": "ใน navigate mode จะให้ position, velocity, attitude และ heading อย่างต่อเนื่อง", "hook": "Navigate mode = Full inertial data", "module": "Module 5.15 Part 1"}, {"q": "What type of gyro is commonly used in modern IRS units?", "opts": ["Laser gyro (or ring laser gyro)", "Only mechanical spinning mass gyros", "Only fibre-optic without any laser"], "ans": 0, "exp": "ใช้ laser gyro (ring laser gyro) ใน IRS สมัยใหม่", "hook": "Modern IRS = Laser gyro", "module": "Module 5.15 Part 1"}, {"q": "What is the purpose of the IRS mode select unit (MSU)?", "opts": ["To select the operating modes of the IRS (e.g. OFF, ALIGN, NAV)", "To tune the VHF radios", "To control the cabin temperature"], "ans": 0, "exp": "MSU ใช้เลือกโหมดการทำงานของ IRS", "hook": "MSU = Mode Select Unit", "module": "Module 5.15 Part 1"}, {"q": "What is the inertial system display unit (ISDU) used for?", "opts": ["To display IRS data and allow pilot interaction with the system", "Only to show engine parameters", "Only to show weather radar"], "ans": 0, "exp": "ISDU แสดงข้อมูล IRS และให้นักบินโต้ตอบกับระบบ", "hook": "ISDU = Display + Interface", "module": "Module 5.15 Part 1"}, {"q": "What does BITE stand for in the context of IRS?", "opts": ["Built-In Test Equipment", "Basic Inertial Tracking Equipment", "Backup Instrument Test Engine"], "ans": 0, "exp": "BITE = Built-In Test Equipment", "hook": "BITE = Built-In Test", "module": "Module 5.15 Part 1"}, {"q": "An ADIRS combines which two systems?", "opts": ["Air Data and Inertial Reference System", "Attitude and Direction Indicator System", "Automatic Dependent Surveillance System"], "ans": 0, "exp": "ADIRS = Air Data + Inertial Reference System", "hook": "ADIRS = Air Data + IRS", "module": "Module 5.15 Part 1"}, {"q": "Why is alignment normally performed on the ground?", "opts": ["Because the system needs a known stationary position and heading reference to initialise", "Because the IRS cannot operate in the air at all", "Because regulations forbid in-flight alignment"], "ans": 0, "exp": "ต้อง align บนพื้นเพราะต้องการตำแหน่งและ heading ที่ทราบแน่นอนขณะหยุดนิ่ง", "hook": "Align on ground = Known position + heading", "module": "Module 5.15 Part 1"}, {"q": "What happens if the IRS loses its alignment during flight?", "opts": ["Navigation performance degrades and the system may require re-alignment or alternative sensors", "The aircraft automatically lands", "All displays remain unaffected"], "ans": 0, "exp": "ประสิทธิภาพการนำทางลดลง และอาจต้องใช้เซ็นเซอร์อื่นหรือ align ใหม่", "hook": "Loss of alignment = Degraded nav", "module": "Module 5.15 Part 1"}, {"q": "What does ECAM stand for?", "opts": ["Electronic Centralised Aircraft Monitoring", "Engine Control and Alert Monitor", "Electronic Cabin Alert Module"], "ans": 0, "exp": "ECAM = Electronic Centralised Aircraft Monitoring", "hook": "ECAM = Airbus centralised monitoring", "module": "Module 5.15 Part 1"}, {"q": "How does ECAM differ significantly from EICAS in the way data is displayed?", "opts": ["ECAM displays data in check-list and pictorial/synoptic format focused on primary systems", "ECAM uses only numerical tables", "ECAM never shows system diagrams"], "ans": 0, "exp": "ECAM แสดงแบบ checklist และ synoptic ส่วน EICAS เน้น engine parameters และ messages", "hook": "ECAM = Checklist + Synoptic", "module": "Module 5.15 Part 1"}, {"q": "On ECAM, which display unit is dedicated to status, warnings and corrective action in sequenced check-list format?", "opts": ["The left/upper unit", "The right/lower unit only", "Both units equally"], "ans": 0, "exp": "จอซ้าย/บน แสดง status, warnings และ corrective action แบบ checklist", "hook": "Left/Upper = Checklist + Warnings", "module": "Module 5.15 Part 1"}, {"q": "On ECAM, which display unit is dedicated to associated information in pictorial or synoptic format?", "opts": ["The right/lower unit", "The left/upper unit only", "Only the PFD"], "ans": 0, "exp": "จอขวา/ล่าง แสดงภาพ synoptic ของระบบ", "hook": "Right/Lower = Synoptic diagrams", "module": "Module 5.15 Part 1"}, {"q": "How many display modes does ECAM have?", "opts": ["Four (three automatic and one manual)", "Only two", "Only one continuous mode"], "ans": 0, "exp": "มี 4 โหมด: 3 อัตโนมัติ + 1 manual", "hook": "ECAM = 4 modes (3 auto + 1 manual)", "module": "Module 5.15 Part 1"}, {"q": "What are the three automatic ECAM display modes?", "opts": ["Flight phase-related, advisory (mode and status), and failure-related modes", "Only take-off and landing modes", "Only engine start modes"], "ans": 0, "exp": "โหมดอัตโนมัติคือ flight phase, advisory และ failure-related", "hook": "Auto modes = Phase + Advisory + Failure", "module": "Module 5.15 Part 1"}, {"q": "What does the manual ECAM mode allow the pilot to select?", "opts": ["Diagrams related to any one of 12 of the aircraft’s systems for routine checking", "Only the engine start sequence", "Only the weather radar"], "ans": 0, "exp": "โหมด manual เลือกดู diagram ของระบบใดระบบหนึ่งจาก 12 ระบบได้", "hook": "Manual = Select any of 12 systems", "module": "Module 5.15 Part 1"}, {"q": "In ECAM, how are single-system warnings conventionally signified?", "opts": ["By underlining the system title displayed", "By flashing the entire screen red", "By a continuous aural tone only"], "ans": 0, "exp": "คำเตือนระบบเดียวจะขีดเส้นใต้ชื่อระบบ", "hook": "Single system = Underlined title", "module": "Module 5.15 Part 1"}, {"q": "ECAM was originally developed for which aircraft?", "opts": ["The Airbus A310", "The Boeing 757", "The Boeing 737-300"], "ans": 0, "exp": "ECAM พัฒนาขึ้นสำหรับ Airbus A310 เป็นเครื่องแรก", "hook": "ECAM first = A310", "module": "Module 5.15 Part 1"}, {"q": "What additional feature does ECAM provide compared with basic EICAS regarding failures?", "opts": ["Corrective actions to be taken by the pilot and system limitations after failures", "Only a list of failed components without actions", "Only engine shutdown commands"], "ans": 0, "exp": "ECAM แสดงขั้นตอนแก้ไขและข้อจำกัดหลังเกิด failure ด้วย", "hook": "ECAM = Failures + Corrective actions + Limitations", "module": "Module 5.15 Part 1"}, {"q": "What does GPS stand for?", "opts": ["Global Positioning System", "Ground Proximity System", "General Positioning Sensor"], "ans": 0, "exp": "GPS = Global Positioning System", "hook": "GPS = Global Positioning", "module": "Module 5.15 Part 1"}, {"q": "How does a GPS receiver determine its position?", "opts": ["By measuring the time taken for signals from multiple satellites to reach the receiver and calculating ranges", "By measuring only magnetic heading", "By using only ground-based radar"], "ans": 0, "exp": "วัดเวลาสัญญาณจากดาวเทียมหลายดวงแล้วคำนวณระยะทาง", "hook": "GPS = Time difference → Range → Position", "module": "Module 5.15 Part 1"}, {"q": "What are the ranges measured by a GPS receiver initially called?", "opts": ["Pseudo-ranges", "True ranges", "Absolute ranges"], "ans": 0, "exp": "ระยะที่ได้จากเวลานี้เรียกว่า pseudo-ranges เพราะยังมี error จากนาฬิกา", "hook": "Initial ranges = Pseudo-ranges", "module": "Module 5.15 Part 1"}, {"q": "Why does a GPS receiver need signals from at least four satellites?", "opts": ["To solve for three-dimensional position and correct the receiver clock error", "To measure only altitude", "To receive weather data"], "ans": 0, "exp": "ต้องมีอย่างน้อย 4 ดาวเทียมเพื่อหาตำแหน่ง 3 มิติและแก้ error นาฬิกา", "hook": "4 satellites = 3D position + clock correction", "module": "Module 5.15 Part 1"}, {"q": "What information does each GPS satellite transmit about its own path?", "opts": ["Its exact position and path (ephemeris) and an almanac of all satellite orbits", "Only the current weather", "Only its serial number"], "ans": 0, "exp": "ดาวเทียมส่ง ephemeris (ตำแหน่งตัวเอง) และ almanac ของทุกดวง", "hook": "Ephemeris + Almanac", "module": "Module 5.15 Part 1"}, {"q": "What type of clock does each GPS satellite carry?", "opts": ["A very accurate atomic clock", "A simple quartz clock", "No clock at all"], "ans": 0, "exp": "ดาวเทียมมี atomic clock ที่แม่นยำสูง", "hook": "Satellite = Atomic clock", "module": "Module 5.15 Part 1"}, {"q": "What is TCAS designed to reduce?", "opts": ["The incidence of mid-air collisions between aircraft", "Only runway incursions", "Only bird strikes"], "ans": 0, "exp": "TCAS ออกแบบมาเพื่อลดการชนกันกลางอากาศ", "hook": "TCAS = Mid-air collision avoidance", "module": "Module 5.15 Part 1"}, {"q": "How does TCAS monitor the airspace around an aircraft?", "opts": ["By interrogating other aircraft equipped with a corresponding active transponder, independent of ATC", "By using only primary radar", "By listening to ATC voice communications only"], "ans": 0, "exp": "TCAS สอบถามเครื่องบินอื่นที่มี transponder โดยอิสระจาก ATC", "hook": "TCAS = Independent of ATC (transponder based)", "module": "Module 5.15 Part 1"}, {"q": "What is the ICAO mandate for TCAS carriage?", "opts": ["Required for aircraft with MTOM over 5,700 kg or authorised to carry more than 19 passengers", "Required only for aircraft over 100 tonnes", "Optional for all aircraft"], "ans": 0, "exp": "ICAO บังคับใช้กับเครื่องบินที่มีน้ำหนักเกิน 5,700 กก. หรือรับผู้โดยสารเกิน 19 คน", "hook": "TCAS mandatory > 5,700 kg or > 19 pax", "module": "Module 5.15 Part 1"}, {"q": "What is the difference between ACAS I and ACAS II?", "opts": ["ACAS I gives Traffic Advisories only; ACAS II gives Traffic Advisories and Resolution Advisories", "ACAS I is for large aircraft only", "There is no difference"], "ans": 0, "exp": "ACAS I ให้แค่ Traffic Advisory ส่วน ACAS II ให้ทั้ง TA และ Resolution Advisory", "hook": "ACAS I = TA only, ACAS II = TA + RA", "module": "Module 5.15 Part 1"}, {"q": "What does a Resolution Advisory (RA) provide to the pilot?", "opts": ["Specific vertical manoeuvre guidance to avoid a collision threat", "Only a traffic symbol on the display", "Only an aural warning without guidance"], "ans": 0, "exp": "RA ให้คำแนะนำการหลบในแนวตั้งที่เฉพาะเจาะจง", "hook": "RA = Climb / Descend guidance", "module": "Module 5.15 Part 1"}, {"q": "In modern glass cockpit aircraft, where may the TCAS display be integrated?", "opts": ["In the Navigation Display (ND) or Electronic Horizontal Situation Indicator (EHSI)", "Only on a separate dedicated panel", "Only on the primary flight display"], "ans": 0, "exp": "TCAS สามารถรวมอยู่ใน ND หรือ EHSI ได้", "hook": "TCAS on ND / EHSI", "module": "Module 5.15 Part 1"}, {"q": "What older instrument may a dedicated TCAS display replace on aircraft without EFIS?", "opts": ["The mechanical Vertical Speed Indicator", "The magnetic compass", "The altimeter"], "ans": 0, "exp": "บนเครื่องที่ไม่มี EFIS จอ TCAS อาจแทนที่ VSI แบบกลไก", "hook": "TCAS can replace mechanical VSI", "module": "Module 5.15 Part 1"}, {"q": "ACAS / TCAS is based on which type of transponder signals?", "opts": ["Secondary surveillance radar (SSR) transponder signals", "Primary radar reflections only", "ADS-B Out only"], "ans": 0, "exp": "TCAS ทำงานจากสัญญาณ SSR transponder", "hook": "TCAS = SSR Mode S based", "module": "Module 5.15 Part 1"}, {"q": "What is the relationship of TCAS to air traffic control?", "opts": ["It operates independently of air traffic control", "It requires continuous ATC clearance for every advisory", "It replaces ATC completely"], "ans": 0, "exp": "TCAS ทำงานอิสระจาก ATC", "hook": "TCAS independent of ATC", "module": "Module 5.15 Part 1"}, {"q": "What type of advisory does ACAS I provide?", "opts": ["Traffic Advisories (TAs) but no recommended manoeuvres", "Both Traffic and Resolution Advisories", "Only Resolution Advisories"], "ans": 0, "exp": "ACAS I ให้แค่ Traffic Advisory ไม่แนะนำการหลบ", "hook": "ACAS I = TA only", "module": "Module 5.15 Part 1"}, {"q": "What is required for ACAS II to generate coordinated Resolution Advisories?", "opts": ["Both aircraft must be equipped with ACAS II and Mode S transponders", "Only one aircraft needs ACAS", "Both aircraft must be under radar contact"], "ans": 0, "exp": "ทั้งสองเครื่องต้องมี ACAS II และ Mode S จึงจะประสาน RA ได้", "hook": "Coordinated RA = Both ACAS II + Mode S", "module": "Module 5.15 Part 1"}, {"q": "In the GPS system, what do ground stations do?", "opts": ["Monitor the satellites and amend the almanac and ephemeris messages", "Control the flight of the aircraft", "Provide only weather reports"], "ans": 0, "exp": "สถานีภาคพื้นติดตามดาวเทียมและแก้ไขข้อมูล almanac/ephemeris", "hook": "Ground stations = Monitor & update satellites", "module": "Module 5.15 Part 1"}, {"q": "What is the purpose of the almanac transmitted by GPS satellites?", "opts": ["To allow the receiver to know which satellites should be in view and their approximate ranges for faster acquisition", "To provide the exact current position of every aircraft", "To transmit ATC clearances"], "ans": 0, "exp": "Almanac ช่วยให้เครื่องรับรู้ว่าดาวเทียมดวงไหนอยู่ในมุมมองและระยะคร่าว ๆ", "hook": "Almanac = Coarse satellite info for acquisition", "module": "Module 5.15 Part 1"}, {"q": "What is the main advantage of TCAS operating independently of ATC?", "opts": ["It provides a last line of defence against mid-air collisions even if ATC separation fails", "It allows the pilot to ignore all ATC instructions", "It eliminates the need for transponders"], "ans": 0, "exp": "TCAS เป็นแนวป้องกันสุดท้ายแม้ ATC แยกเครื่องบินไม่สำเร็จ", "hook": "TCAS = Last line of defence", "module": "Module 5.15 Part 1"}, {"q": "What does the term ACAS refer to in relation to TCAS?", "opts": ["Airborne Collision Avoidance System – the ICAO generic term of which TCAS is an implementation", "Automatic Cabin Alert System", "Aircraft Communication Addressing System"], "ans": 0, "exp": "ACAS เป็นคำทั่วไปของ ICAO ส่วน TCAS เป็นการนำไปใช้จริง", "hook": "ACAS = ICAO term, TCAS = implementation", "module": "Module 5.15 Part 1"}, {"q": "What does IMA stand for?", "opts": ["Integrated Modular Avionics", "Independent Modular Architecture", "Instrument Management Assembly"], "ans": 0, "exp": "IMA = Integrated Modular Avionics", "hook": "IMA = Integrated Modular Avionics", "module": "Module 5.15 Part 2"}, {"q": "What problem with ARINC 429 led to the development of IMA?", "opts": ["The amount of digital information exchanged by LRUs grew beyond the capability of ARINC 429 to carry it", "ARINC 429 was too expensive", "ARINC 429 could not support analogue signals"], "ans": 0, "exp": "ปริมาณข้อมูลดิจิทัลระหว่าง LRU เพิ่มขึ้นจน ARINC 429 รับไม่ไหว", "hook": "ARINC 429 capacity limit → need for IMA", "module": "Module 5.15 Part 2"}, {"q": "Which Boeing aircraft first moved from federated avionics toward an integrated modular architecture with the AIMS cabinet?", "opts": ["Boeing 777", "Boeing 737 classic", "Boeing 747-200"], "ans": 0, "exp": "Boeing 777 เป็นเครื่องแรกที่ใช้แนวทาง IMA ด้วย AIMS cabinet", "hook": "B777 = first IMA with AIMS", "module": "Module 5.15 Part 2"}, {"q": "What does AIMS stand for in the Boeing 777 context?", "opts": ["Airplane Information Management System", "Aircraft Inertial Management System", "Automatic Instrument Monitoring System"], "ans": 0, "exp": "AIMS = Airplane Information Management System", "hook": "AIMS = Airplane Information Management", "module": "Module 5.15 Part 2"}, {"q": "In IMA, conventional LRUs are replaced by what?", "opts": ["Software applications loaded onto shared processing modules", "More individual dedicated computers", "Only mechanical instruments"], "ans": 0, "exp": "LRU แบบเดิมถูกแทนที่ด้วย software applications ที่โหลดบน processing modules ร่วมกัน", "hook": "IMA = Software on shared modules", "module": "Module 5.15 Part 2"}, {"q": "What are the processing modules called by Airbus in their IMA approach?", "opts": ["CPIOMs (Core Processing Input/Output Modules)", "GPMs only", "AIMS cabinets"], "ans": 0, "exp": "Airbus เรียก processing modules ว่า CPIOM", "hook": "Airbus = CPIOM, Boeing = GPM / CCS", "module": "Module 5.15 Part 2"}, {"q": "What are the processing modules called by Boeing in the 787 context?", "opts": ["GPMs (General Processing Modules) within the Common Core System (CCS)", "Only CPIOMs", "Only AFDX switches"], "ans": 0, "exp": "Boeing 787 ใช้ GPM ภายใน Common Core System", "hook": "Boeing 787 = GPM + CCS", "module": "Module 5.15 Part 2"}, {"q": "What network standard does the Airbus A380 IMA use to connect its processing modules?", "opts": ["Avionics Full-Duplex Switched Ethernet (AFDX) / ARINC 664", "Only ARINC 429", "Only CAN bus"], "ans": 0, "exp": "A380 ใช้ AFDX (ARINC 664) เป็นเครือข่ายหลัก", "hook": "A380 IMA = AFDX / ARINC 664", "module": "Module 5.15 Part 2"}, {"q": "How many processing modules does the A380 IMA approach typically rely on?", "opts": ["Eight processing modules (seven CPIOMs and one IOM)", "Only two central processors", "Twenty separate LRUs"], "ans": 0, "exp": "A380 ใช้ 8 modules (7 CPIOM + 1 IOM)", "hook": "A380 = 8 modules (7 CPIOM + 1 IOM)", "module": "Module 5.15 Part 2"}, {"q": "What is a key difference between Boeing 787 CCS and Airbus A380 IMA approaches?", "opts": ["Boeing uses a central computing system while Airbus uses distributed processing modules linked by AFDX", "Both use identical central processors", "Airbus uses only ARINC 429"], "ans": 0, "exp": "Boeing ใช้ระบบคอมพิวเตอร์กลาง ส่วน Airbus ใช้ modules กระจายที่เชื่อมด้วย AFDX", "hook": "787 = Central CCS, A380 = Distributed AFDX", "module": "Module 5.15 Part 2"}, {"q": "What advantage does IMA provide regarding certification of new functions?", "opts": ["New software functions can be added in ARINC 653 partitions that may not need the same certification level as flight-critical functions", "Every new function must be certified to the highest DAL", "No new functions can ever be added"], "ans": 0, "exp": "สามารถเพิ่ม software ใน partition ที่ระดับ certification ต่ำกว่าฟังก์ชันสำคัญได้", "hook": "IMA + ARINC 653 = Flexible certification levels", "module": "Module 5.15 Part 2"}, {"q": "What is the main purpose of the ARINC 653 standard in IMA?", "opts": ["To provide partitioning so that applications of different criticality can share the same processing resources safely", "To define the physical connector pin-outs only", "To replace all Ethernet networks"], "ans": 0, "exp": "ARINC 653 ให้ partitioning เพื่อให้แอปพลิเคชันระดับความสำคัญต่างกันใช้ processor ร่วมกันได้อย่างปลอดภัย", "hook": "ARINC 653 = Partitioning for shared resources", "module": "Module 5.15 Part 2"}, {"q": "In the Boeing 787, the Common Core System (CCS) eliminates more than how many different LRUs?", "opts": ["More than 100 different LRUs", "About 10 LRUs", "Only 2 LRUs"], "ans": 0, "exp": "CCS ของ 787 ช่วยลด LRU ได้มากกว่า 100 ตัว", "hook": "787 CCS = eliminates >100 LRUs", "module": "Module 5.15 Part 2"}, {"q": "What does the IOM in the Airbus A380 IMA do?", "opts": ["It is an Input/Output Module that does not host any applications itself", "It runs all flight management software", "It replaces the flight control computers"], "ans": 0, "exp": "IOM เป็นโมดูล input/output ที่ไม่โฮสต์ application เอง", "hook": "IOM = I/O only, no applications", "module": "Module 5.15 Part 2"}, {"q": "Although Airbus IMA computers have different part numbers, which cards are common to all of them?", "opts": ["The memory and power supply cards", "Only the input/output cards", "Only the cooling fans"], "ans": 0, "exp": "การ์ด memory และ power supply เป็นแบบเดียวกันทุกตัว", "hook": "Common = Memory + Power supply cards", "module": "Module 5.15 Part 2"}, {"q": "What is the main benefit of moving from federated architecture to IMA?", "opts": ["Shared computing resources reduce weight, volume, power consumption and the number of dedicated LRUs", "It increases the number of individual computers required", "It removes all software from the aircraft"], "ans": 0, "exp": "ใช้ทรัพยากรร่วมกัน ช่วยลดน้ำหนัก ปริมาตร กำลังไฟฟ้า และจำนวน LRU", "hook": "IMA = Shared resources → less weight/power/LRUs", "module": "Module 5.15 Part 2"}, {"q": "In IMA, applications for specific former LRUs are loaded as what?", "opts": ["Software applications hosted on the shared processing modules", "Separate hardware boxes for each function", "Only firmware burned into ROMs"], "ans": 0, "exp": "ฟังก์ชันเดิมของ LRU ถูกโหลดเป็น software บน modules ร่วม", "hook": "Former LRUs → Software apps on modules", "module": "Module 5.15 Part 2"}, {"q": "What network technology is used in modern IMA to provide high bandwidth deterministic communication?", "opts": ["AFDX (Avionics Full-Duplex Switched Ethernet) based on ARINC 664", "Only classic ARINC 429", "Only analogue signalling"], "ans": 0, "exp": "ใช้ AFDX ตามมาตรฐาน ARINC 664 เพื่อการสื่อสารความเร็วสูงและ deterministic", "hook": "Modern IMA network = AFDX / ARINC 664", "module": "Module 5.15 Part 2"}, {"q": "What are the three main sub-systems that comprise the cabin system?", "opts": ["Cabin core system, in-flight entertainment system (IFE), and cabin monitoring system", "Only IFE and lighting", "Only passenger address and toilets"], "ans": 0, "exp": "Cabin system ประกอบด้วย cabin core, IFE และ cabin monitoring", "hook": "Cabin = Core + IFE + Monitoring", "module": "Module 5.15 Part 2"}, {"q": "What is the cabin core system used for?", "opts": ["Integrated functional control, operation, testing and monitoring of cabin systems and to increase cabin comfort", "Only playing movies", "Only controlling the engines"], "ans": 0, "exp": "Cabin core ใช้ควบคุม ทดสอบ และมอนิเตอร์ระบบห้องโดยสาร รวมถึงเพิ่มความสะดวกสบาย", "hook": "Core = Control + Monitor + Comfort", "module": "Module 5.15 Part 2"}, {"q": "What does the cabin address system provide?", "opts": ["The public announcement system by which the flight and cabin crew can broadcast messages to passengers", "Only interphone between pilots", "Only satellite phone"], "ans": 0, "exp": "Cabin address = ระบบประกาศสาธารณะถึงผู้โดยสาร", "hook": "Cabin address = PA system", "module": "Module 5.15 Part 2"}, {"q": "What is stored and processed by the cabin mass memory system?", "opts": ["Cabin related data such as systems configuration data and multimedia programs", "Only flight plan data", "Only engine parameters"], "ans": 0, "exp": "เก็บข้อมูล configuration และโปรแกรมมัลติมีเดียของห้องโดยสาร", "hook": "Mass memory = Config + Multimedia", "module": "Module 5.15 Part 2"}, {"q": "What functions does the Cabin Service System (Boeing) provide?", "opts": ["Passenger service system, cabin interphone, control of cabin signs, lighting, water and toilet tank status", "Only engine starting", "Only navigation"], "ans": 0, "exp": "ให้บริการผู้โดยสาร, interphone, ควบคุมป้ายไฟ แสงสว่าง น้ำ และสถานะโถส้วม", "hook": "CSS = PSS + Interphone + Signs/Lighting/Water/Toilet", "module": "Module 5.15 Part 2"}, {"q": "What does the cabin monitoring system include?", "opts": ["Surveillance cameras and monitors (it does not include external anti-hijack devices)", "Only external cameras outside the aircraft", "Only smoke detectors"], "ans": 0, "exp": "รวมกล้องและจอภายในห้องโดยสาร (ไม่รวมอุปกรณ์ต่อต้านจี้เครื่องบินภายนอก)", "hook": "Monitoring = Internal cameras/monitors", "module": "Module 5.15 Part 2"}, {"q": "What is the Cabin Intercommunication Data System (CIDS)?", "opts": ["The system that provides the data network and control for cabin functions on Airbus aircraft", "Only the passenger entertainment system", "Only the cockpit voice recorder"], "ans": 0, "exp": "CIDS เป็นระบบเครือข่ายและควบคุมฟังก์ชันห้องโดยสารของ Airbus", "hook": "CIDS = Airbus cabin data & control", "module": "Module 5.15 Part 2"}, {"q": "What do Flight Attendant Panels allow the cabin crew to do?", "opts": ["Control and monitor various cabin systems such as lighting, temperature, passenger calls and announcements", "Control the aircraft flight path", "Tune the navigation radios"], "ans": 0, "exp": "แผงของแอร์โฮสเตสใช้ควบคุมและมอนิเตอร์ระบบห้องโดยสาร", "hook": "FAP = Cabin control & monitor for crew", "module": "Module 5.15 Part 2"}, {"q": "What communication functions are typically provided by the cabin system?", "opts": ["Cabin interphone, public address, service interphone and cabin-to-ground links", "Only HF radio to ATC", "Only satellite navigation"], "ans": 0, "exp": "มี interphone, PA, service interphone และเชื่อมต่อกับภาคพื้น", "hook": "Cabin comms = Interphone + PA + Service + Ground", "module": "Module 5.15 Part 2"}, {"q": "What is the purpose of the service interphone?", "opts": ["To allow communication between cabin crew, flight crew and ground service personnel", "To broadcast music to passengers", "To control the engines"], "ans": 0, "exp": "ใช้สื่อสารระหว่างลูกเรือห้องโดยสาร นักบิน และเจ้าหน้าที่ภาคพื้น", "hook": "Service interphone = Crew + Ground", "module": "Module 5.15 Part 2"}, {"q": "What indicating functions are provided by the cabin system?", "opts": ["Status of doors, slides, lights, water quantity, toilet status and other cabin parameters", "Only engine N1", "Only airspeed"], "ans": 0, "exp": "แสดงสถานะประตู สไลด์ ไฟ ปริมาณน้ำ โถส้วม ฯลฯ", "hook": "Indicating = Doors, slides, water, toilets, lights", "module": "Module 5.15 Part 2"}, {"q": "What control functions can the cabin system perform?", "opts": ["Control of cabin lighting, temperature, electric window shades, passenger service units and other comfort systems", "Control of the flight control surfaces", "Control of the landing gear"], "ans": 0, "exp": "ควบคุมแสง อุณหภูมิ ม่านไฟฟ้า และระบบความสะดวกอื่น ๆ", "hook": "Control = Lighting, temp, shades, PSU", "module": "Module 5.15 Part 2"}, {"q": "What is an example of a miscellaneous cabin system function?", "opts": ["Electric window shades or active noise control", "Only the autopilot", "Only the IRS"], "ans": 0, "exp": "ตัวอย่างเช่นม่านไฟฟ้าหรือ active noise control", "hook": "Misc = Window shades, noise control etc.", "module": "Module 5.15 Part 2"}, {"q": "The cabin system gives the cabin crew an interface to which two main systems?", "opts": ["The cabin core system and the cabin monitoring system", "Only the flight management system", "Only the TCAS"], "ans": 0, "exp": "ลูกเรือห้องโดยสารเชื่อมต่อกับ cabin core และ cabin monitoring", "hook": "Crew interface = Core + Monitoring", "module": "Module 5.15 Part 2"}, {"q": "What does IFE stand for in the cabin system context?", "opts": ["In-Flight Entertainment system", "Instrument Flight Equipment", "Integrated Flight Electronics"], "ans": 0, "exp": "IFE = In-Flight Entertainment", "hook": "IFE = Passenger entertainment", "module": "Module 5.15 Part 2"}, {"q": "Who controls the Cabin Service System on Boeing aircraft?", "opts": ["The cabin service system controller, set by the configuration database", "Only the captain", "Only the ground engineer"], "ans": 0, "exp": "ควบคุมโดย cabin service system controller ที่ตั้งค่าจาก configuration database", "hook": "CSS controlled by controller + config database", "module": "Module 5.15 Part 2"}, {"q": "What is the cabin system overall definition according to the notes?", "opts": ["Units and components which furnish means of entertaining passengers and providing communication within the aircraft and between cabin and ground", "Only the passenger seats", "Only the galley equipment"], "ans": 0, "exp": "ครอบคลุมระบบบันเทิงและการสื่อสารภายในเครื่องและกับภาคพื้น", "hook": "Cabin system = Entertainment + Communication", "module": "Module 5.15 Part 2"}, {"q": "What does ADS-B stand for?", "opts": ["Automatic Dependent Surveillance – Broadcast", "Aircraft Data System – Backup", "Automatic Direction System – Broadcast"], "ans": 0, "exp": "ADS-B = Automatic Dependent Surveillance – Broadcast", "hook": "ADS-B = Automatic Dependent Surveillance Broadcast", "module": "Module 5.15 Part 2"}, {"q": "How does ADS-B determine an aircraft’s precise location?", "opts": ["It relies on the satellite-based Global Positioning System (GPS)", "It uses only primary radar", "It uses only inertial sensors"], "ans": 0, "exp": "ADS-B ใช้ GPS ในการหาตำแหน่ง", "hook": "ADS-B position = GPS based", "module": "Module 5.15 Part 2"}, {"q": "What information is combined with position and then broadcast by ADS-B?", "opts": ["Aircraft type, speed, flight number, and whether it is turning, climbing or descending", "Only the passenger list", "Only fuel quantity"], "ans": 0, "exp": "รวมประเภทเครื่อง ความเร็ว หมายเลขเที่ยวบิน และสถานะการเลี้ยว/ไต่/ลด", "hook": "ADS-B broadcast = Pos + Type + Speed + Intent", "module": "Module 5.15 Part 2"}, {"q": "How frequently does an ADS-B equipped aircraft broadcast its information?", "opts": ["Several times a second", "Once every minute", "Only when interrogated by ATC"], "ans": 0, "exp": "ส่งข้อมูลหลายครั้งต่อวินาที", "hook": "ADS-B = Several times per second", "module": "Module 5.15 Part 2"}, {"q": "Within approximately what range can other ADS-B equipped aircraft and ground stations receive the broadcasts?", "opts": ["About 150 miles", "About 10 miles", "Only line-of-sight less than 5 miles"], "ans": 0, "exp": "รับได้ในระยะประมาณ 150 ไมล์", "hook": "ADS-B range ≈ 150 miles", "module": "Module 5.15 Part 2"}, {"q": "What is TIS-B?", "opts": ["Traffic Information Service – Broadcast, which provides traffic information from ground radar to ADS-B equipped aircraft", "A type of weather radar", "A cabin interphone system"], "ans": 0, "exp": "TIS-B ส่งข้อมูล traffic จาก radar ภาคพื้นไปยังเครื่องที่มี ADS-B", "hook": "TIS-B = Traffic from ground radar via ADS-B", "module": "Module 5.15 Part 2"}, {"q": "What is FIS-B?", "opts": ["Flight Information Services – Broadcast, providing free graphical weather products, TFRs and special use airspace information", "A collision avoidance system", "A flight management computer"], "ans": 0, "exp": "FIS-B ให้ข้อมูลอากาศ แผนที่ TFR และ special use airspace ฟรี", "hook": "FIS-B = Free weather + TFR + airspace info", "module": "Module 5.15 Part 2"}, {"q": "What technology is used worldwide for ADS-B to ensure global interoperability?", "opts": ["1090 MHz Mode S Extended Squitter", "Only UAT on 978 MHz", "Only ARINC 429"], "ans": 0, "exp": "ใช้ 1090 MHz Mode S Extended Squitter เพื่อความเข้ากันได้ทั่วโลก", "hook": "Global ADS-B = 1090 ES", "module": "Module 5.15 Part 2"}, {"q": "What is the Universal Access Transceiver (UAT) mainly used for?", "opts": ["A datalink technology used in the USA that is compatible with ADS-B services", "The only worldwide standard", "A type of inertial sensor"], "ans": 0, "exp": "UAT เป็นเทคโนโลยี datalink ที่ใช้ในสหรัฐฯ และเข้ากันได้กับ ADS-B", "hook": "UAT = USA datalink for ADS-B", "module": "Module 5.15 Part 2"}, {"q": "How do ground stations enhance the ADS-B picture for equipped aircraft?", "opts": ["They combine ADS-B broadcasts with additional location information from ground radar for non-ADS-B aircraft and rebroadcast the data", "They only receive data and never transmit", "They replace GPS completely"], "ans": 0, "exp": "สถานีภาคพื้นรวมข้อมูล ADS-B กับ radar แล้วส่งกลับไปให้เครื่องบิน", "hook": "Ground stations = Fuse ADS-B + Radar → rebroadcast", "module": "Module 5.15 Part 2"}, {"q": "What is one major safety benefit of ADS-B for pilots?", "opts": ["It increases situational awareness by displaying traffic and weather information in the cockpit", "It eliminates the need for any transponder", "It allows flight without any GPS"], "ans": 0, "exp": "เพิ่ม situational awareness ด้วยการแสดง traffic และอากาศในห้องนักบิน", "hook": "ADS-B = Better traffic + weather awareness", "module": "Module 5.15 Part 2"}, {"q": "ADS-B is described as ‘dependent’ because it depends on what?", "opts": ["It depends on the aircraft’s navigation systems (primarily GPS) for position information", "It depends only on ATC radar", "It depends only on voice reports"], "ans": 0, "exp": "เรียกว่า dependent เพราะพึ่งพาระบบนำทางของเครื่องบิน (หลัก ๆ คือ GPS)", "hook": "Dependent = Depends on own nav (GPS)", "module": "Module 5.15 Part 2"}, {"q": "What is the relationship between ADS-B and TCAS mentioned in the notes?", "opts": ["ADS-B can provide additional traffic information but TCAS remains the primary collision avoidance system with resolution capability", "ADS-B completely replaces TCAS", "TCAS is no longer required when ADS-B is fitted"], "ans": 0, "exp": "ADS-B ช่วยเพิ่มข้อมูล traffic แต่ TCAS ยังเป็นระบบหลักที่มี RA", "hook": "ADS-B supplements, TCAS still primary for RA", "module": "Module 5.15 Part 2"}, {"q": "In areas without ADS-B ground stations, what still works?", "opts": ["Air-to-air ADS-B traffic awareness between equipped aircraft still functions", "Nothing works", "Only weather is available"], "ans": 0, "exp": "การรับรู้ traffic ระหว่างเครื่องบินด้วยกันยังทำงานได้แม้ไม่มีสถานีภาคพื้น", "hook": "Air-to-air ADS-B works without ground stations", "module": "Module 5.15 Part 2"}, {"q": "What free services does FIS-B provide to pilots?", "opts": ["Graphical National Weather Service products, temporary flight restrictions and special use airspace information", "Only traffic targets", "Only resolution advisories"], "ans": 0, "exp": "FIS-B ให้แผนที่อากาศ TFR และข้อมูล special use airspace ฟรี", "hook": "FIS-B = Free weather + TFR + SUA", "module": "Module 5.15 Part 2"}, {"q": "What is one of the on-board testing capabilities of a modern FBW system?", "opts": ["Built-in test and monitoring functions that continuously check system health", "Only manual checks by the pilot every hour", "No testing capability is provided"], "ans": 0, "exp": "FBW มี BITE
